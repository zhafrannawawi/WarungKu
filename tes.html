    const selK = $("fk-kelas"),

    const isi = (sel, arr, label, key, def) => {

    // ===== FILTER =====
    // Membaca kelas & shift dari teks. Contoh yang dikenali: "1A", "TRPL 1A MALAM", "kelas C Malam", "(B dan C Malam)",
    // "kelas A, B, C Malam", "Malam B", "Malam (A, B, C)", "(Malam)". Hasilnya disimpan agar tidak dihitung ulang.
    const memoKelas = new Map();

    function infoKelas(t) {
      t = String(t || "");
      const hit = memoKelas.get(t);
      if (hit) return hit;
      const s = t
        .replace(
          /\b(malam|pagi)\b/gi,
          (m) => m[0].toUpperCase() + m.slice(1).toLowerCase(),
        )
        .replace(/\b(kelas|kls|class)\b/gi, "kelas")
        .replace(/\b(dan|atau)\b/gi, (m) => m.toLowerCase());
      const L = "[A-D](?:\\s*(?:,|dan|&|/|atau|-)\\s*[A-D])*",
        E = "(?![A-Za-z0-9])",
        B = "(?:^|[^A-Za-z0-9])";
      const hur = [],
        shf = [],
        kel = [];
      const tambah = (arr, v) => {
        if (arr.indexOf(v) < 0) arr.push(v);
      };
      const huruf = (txt) =>
        (txt.match(/[A-D]/g) || []).forEach((h) => tambah(hur, h));
      let m;
      const p1 = new RegExp(
        B + "(" + L + ")" + E + "\\s*\\)?\\s*(?:Malam|Pagi)\\b",
        "g",
      ); // "(B dan C Malam)"
      while ((m = p1.exec(s))) huruf(m[1]);
      const p2 = new RegExp(
        "\\b(?:Malam|Pagi)\\s*[\\(\\-:]?\\s*(" + L + ")" + E,
        "g",
      ); // "Malam B", "Malam (A, B, C)"
      while ((m = p2.exec(s))) huruf(m[1]);
      const p3 = new RegExp("\\bkelas\\s*\\(?\\s*(" + L + ")" + E, "g"); // "kelas C", "kelas A, B, C"
      while ((m = p3.exec(s))) huruf(m[1]);
      const p4 = new RegExp(B + "([1-4])([A-Da-d])" + E, "g"); // "1A", "TRPL 1A"
      while ((m = p4.exec(s))) {
        const k = m[1] + m[2].toUpperCase();
        if (KELAS_LIST.indexOf(k) >= 0) tambah(kel, k);
      }
      const p5 = /\b(Malam|Pagi)\b/g;
      while ((m = p5.exec(s))) {
        const v = SHIFT_LIST.find(
          (x) => x.toLowerCase() === m[1].toLowerCase(),
        );
        if (v) tambah(shf, v);
      }
      const lain = PRODI_LAIN.some((p) =>
        new RegExp(
          "(?:^|[^A-Za-z0-9])" +
            p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") +
            "(?![A-Za-z0-9])",
          "i",
        ).test(t),
      );
      const r = {
        kel,
        hur,
        shf,
        lain,
      };
      if (memoKelas.size > 3000) memoKelas.clear();
      memoKelas.set(t, r);
      return r;
    }

    function cocokInfo(i) {
      const kel = selK.value.toUpperCase(),
        huruf = kel.slice(-1);
      if (i.lain) return false;
      if (i.kel.length && i.kel.indexOf(kel) < 0) return false;
      if (i.hur.length && i.hur.indexOf(huruf) < 0) return false;
      if (i.shf.length && i.shf.indexOf(selS.value) < 0) return false;
      return true;
    }
    const cocokTeks = (t) => all.checked || cocokInfo(infoKelas(t));
    const milikku = (d) => cocokTeks(d.teks);
    const isDone = (d) => !!(done[d.id] || d.selesai || kirim[d.id]);
    const lolos = (d) => {

      const q = inQ.value.trim().toLowerCase();
      return (
        !q ||
        (d.nama + " " + d.course + " " + d.desc).toLowerCase().indexOf(q) >= 0
      );

    // ===== DATA TIMELINE MOODLE =====
    const BULAN = {
      jan: 0,
      feb: 1,
      mar: 2,
      apr: 3,
      may: 4,
      mei: 4,
      jun: 5,
      jul: 6,
      aug: 7,

    const blokNative = () =>

    function cariTanggal(t) {
      const m = t.match(/(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/);
      const b = m && BULAN[m[2].slice(0, 3).toLowerCase()];
      return b === undefined || !m
        ? null
        : {
            y: +m[3],
            m: b,
            d: +m[1],
          };
    }

    function tanggalHeading(el) {
      for (let n = el; n && n !== document.body; n = n.parentElement)
        for (
          let p = n.previousElementSibling;
          p;
          p = p.previousElementSibling
        ) {
          const t = bersih(p.textContent);
          const d = t.length < 60 && cariTanggal(t);
          if (d) return d;
        }
      return null;
    }

    function bacaData() {
      const b = blokNative();
      const items = b
        ? b.querySelectorAll('[data-region="event-list-item"]')
        : [];
      return Array.prototype.map.call(items, (it) => {
        const teks = bersih(it.textContent);
        let nama = "",
          url = "#";
        Array.prototype.some.call(it.querySelectorAll("a[href]"), (a) => {
          const tx = bersih(a.textContent);
          if (/\bbtn\b/.test(a.className) || !tx) return false;
          nama = tx;
          url = a.href;
          return true;
        });
        const btn = it.querySelector(".btn[href]");
        const aksi = btn
          ? {
              name: bersih(btn.textContent),
              url: btn.href,
            }
          : null;
        const wadah = it.closest('[data-region="course-events-container"]');
        const hc = wadah && wadah.querySelector("h3,h4,h5,h6");
        const course = hc ? bersih(hc.textContent) : "";
        const wj = teks.match(/(\d{1,2}):(\d{2})/),
          tg = tanggalHeading(it);
        const ts = tg
          ? new Date(
              tg.y,
              tg.m,
              tg.d,
              wj ? +wj[1] : 23,
              wj ? +wj[2] : 59,
              0,
            ).getTime()
          : null;
        let desc = teks;
        [wj && wj[0], nama, aksi && aksi.name].forEach((x) => {
          if (x) desc = desc.replace(x, "");
        });
        desc = bersih(desc.replace(/Overdue/i, ""));
        return {
          id: idStabil(url, nama || teks),
          ts,
          nama: nama || teks,

          course,
          desc,
          aksi,
          teks: teks + " " + course,

      });

    // ===== LABEL SISA WAKTU =====
    const TONE = {

    const mk = (t, c, i) => ({

    function label(ts) {
      if (ts === null) return mk("Belum ada tanggal", "grey", "calendar-x");
      const diff = ts - Date.now();
      if (diff < 0) {
        const hl = Math.floor(-diff / 864e5),
          jl = Math.floor(-diff / 36e5);
        return mk(
          hl >= 1
            ? `Terlewat ${hl} hari lalu`
            : jl >= 1
              ? `Terlewat ${jl} jam lalu`
              : "Baru saja terlewat",
          "red",
          "exclamation-triangle-fill",
        );
      }
      const hk = hariKalender(ts),
        jam = Math.floor(diff / 36e5);
      if (hk === 0)
        return mk(
          diff < 36e5
            ? "Kurang dari 1 jam lagi"
            : new Date(ts).getHours() >= 18
              ? `Nanti malam (${jam} jam lagi)`
              : `Hari ini (${jam} jam lagi)`,

    // ===== JADWAL KULIAH & DOSEN =====
    const HARI = [

      "Minggu",

      "Rabu",
      "Kamis",
      "Jum'at",
      "Sabtu",
    ];

    const dosenMap = {};
    DOSEN_DATA.forEach((l) => {

    function waUrl(hp) {
      let d = String(hp || "").replace(/\D/g, "");

    }
    // Cari tautan course: dari halaman, lalu dari daftar course tersimpan, terakhir pencarian course
    const linkKode = (kode, nama) => {
      const a = Array.prototype.find.call(
        document.querySelectorAll('a[href*="/course/view.php?id="]'),
        (x) =>
          !panel.contains(x) &&

      const cocok = lst.filter((c) => cocokMatkul(c.nama, kode + " " + nama));

    let jadwalCache = null,

    function bacaJadwal() {
      if (!jadwalCache) {

          jadwalCache[h] = JADWAL[h]
            .map((r) => {

                  .split("/")
                  .map(

                        nama: x.trim(),
                        nik: "",
                        hp: "",

                  );
              return {
                s: menit(r[0]),
                e: menit(r[1]),
                kode: r[2],
                nama: r[3],
                dosen: ds.map((d) => d.nama).join(" / "),
                nik: ds
                  .map((d) => d.nik)
                  .filter(Boolean)
                  .join(", "),
                wa: ds
                  .map((d) => ({
                    nama: d.nama,
                    url: waUrl(d.hp),
                  }))
                  .filter((w) => w.url),
                ruang: online ? "" : r[5],
                tipe: r[6] ? "Praktikum" : online ? "Online" : "Tatap muka",
                link: "",
              };
            })
            .sort((x, y) => x.s - y.s);
        });
      }
      if (Date.now() - linkTs > 5000) {
        linkTs = Date.now();
        Object.keys(jadwalCache).forEach((h) =>
          jadwalCache[h].forEach((k) => {
            if (!k.link || /course\/search\.php/.test(k.link))
              k.link = linkKode(k.kode, k.nama);
          }),
        );
      }
      return jadwalCache;
    }
    const durasi = (m) =>
      m >= 60
        ? Math.floor(m / 60) +
          " jam" +
          (m % 60 ? " " + (m % 60) + " menit" : "")
        : m + " menit";

    // Satu baris kuliah, dipakai di tab Jadwal. now = menit sekarang jika hari ini, selain itu null.
    function barisKuliah(k, ix, now, full) {
      const jalan = now !== null && now >= k.s && now < k.e,
        lewat = now !== null && now >= k.e;
      const cls =
        k.tipe === "Praktikum" ? "pr" : k.tipe === "Tatap muka" ? "tm" : "";
      const meta = [
        k.kode,
        k.tipe,
        k.ruang && "Ruang " + k.ruang,
        k.dosen && "Dosen " + k.dosen,
        full && k.nik && "NIDN/NIK " + k.nik,
        full && durasi(k.e - k.s),
      ]
        .filter(Boolean)
        .join(" · ");
      const nm = k.link
        ? `<a class="fk-name" href="${esc(k.link)}">${esc(k.nama)}</a>`
        : esc(k.nama);
      const aksi =
        (jalan
          ? '<span class="fk-tag fk-live" style="background:#d3f8df;color:#067647">Sedang berlangsung</span>'
          : "") +
        (full
          ? k.wa
              .map(
                (w) =>
                  `<a class="fk-btn wa" href="${esc(w.url)}" target="_blank" rel="noopener noreferrer">${ic("whatsapp")} WA ${k.wa.length > 1 ? esc(w.nama.split(/[ ,]/)[0]) : "dosen"}</a>`,
              )
              .join("")
          : "");
      return (
        `<div class="fk-ag${lewat ? " past" : ""}" style="--i:${Math.min(ix, 10)}"><div class="t">${hhmm(k.s)}<small>${hhmm(k.e)}</small></div>` +
        `<div class="c ${cls}"${k.link ? ` data-href="${esc(k.link)}" style="cursor:pointer" title="Buka course"` : ""}><div class="nm">${nm}</div><div class="fk-sub">${esc(meta)}</div>${aksi ? `<div class="fk-row">${aksi}</div>` : ""}</div></div>`
      );
    }

    function renderJadwal() {
      const jd = bacaJadwal(),
        now = new Date(),
        mnt = now.getHours() * 60 + now.getMinutes(),
        hariIni = HARI[now.getDay()];
      if (jdOpen === null) jdOpen = jd[hariIni] ? hariIni : "senin";
      const html = [
        "senin",
        "selasa",
        "rabu",
        "kamis",
        "jumat",
        "sabtu",
        "minggu",
      ]
        .filter((h) => jd[h] && jd[h].length)
        .map((h) => {
          const ini = h === hariIni,
            buka = jdOpen === h;
          return (
            `<div class="fk-jday${ini ? " now" : ""}"><button type="button" class="fk-jsum" data-day="${h}" aria-expanded="${buka}">` +
            `<span><strong>${HARI_TAMPIL[HARI.indexOf(h)]}</strong> <span class="fk-sub">${jd[h].length} sesi</span>` +
            `${ini ? ' <span class="fk-tag" style="background:#e8f0ff;color:#1f55c4">Hari ini</span>' : ""}</span>${ic("chevron-down", "chev")}</button>` +
            (buka
              ? `<div class="fk-jbody">${jd[h].map((k, i) => barisKuliah(k, i, ini ? mnt : null, true)).join("")}</div>`
              : "") +
            "</div>"
          );
        })
        .join("");
      $("fk-jadwal").innerHTML =
        html ||
        `<div class="fk-empty">${ic("info-circle")}Belum ada jadwal kuliah.</div>`;
    }

    // ===== TUGAS =====
    const skel = (n) =>
      '<div class="fk-skel"><i style="width:55%"></i><i style="width:90%"></i><i style="width:35%"></i></div>'.repeat(
        n,
      );
    // Warna tetap per matkul, diturunkan dari kode matkul
    function warnaMatkul(course) {
      const k = (String(course).match(/[A-Za-z]{2,}\d{2,}/) || [
        bersih(String(course).split("/")[0]),
      ])[0];
      let h = 0;
      for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) % 12;
      h *= 30;
      return {
        bar: `hsl(${h},65%,48%)`,
        bg: `hsl(${h},85%,93%)`,
        fg: `hsl(${h},60%,28%)`,
      };
    }

    function pesanError() {
      const m = sesiHabis
        ? "Sesi login Moodle berakhir. Muat ulang halaman lalu login lagi. Data lama tetap ditampilkan."
        : timelineGagal
          ? "Data tugas Moodle tidak bisa dimuat di halaman ini."
          : extraGagal
            ? `Gagal memuat ${extraGagal} course dari server.`
            : "";
      return m
        ? `<div class="fk-errbox">${ic("wifi-off")}<span>${m}</span><button type="button" class="fk-btn" data-retry>${ic("arrow-clockwise")} Coba lagi</button></div>`
        : "";
    }

    function kartu(d, i) {
      const cek = d.jenis === "cek",
        tt = d.ts !== null ? d.ts : cek ? d.tsAsli : null,
        L = cek ? mk("Perlu dicek", "grey", "question-circle") : label(d.ts),
        sd = isDone(d),
        pr = !sd && !!proses[d.id],
        w = warnaMatkul(d.course || d.nama);
      const tombol =
        d.aksi && d.aksi.name
          ? `<a class="fk-btn" href="${esc(d.aksi.url)}">${ic("box-arrow-up-right")} ${esc(d.aksi.name)}</a>`
          : "";
      const mulai = sd
        ? ""
        : `<button type="button" class="fk-btn${pr ? " go" : ""}" data-start="${esc(d.id)}">${ic(pr ? "hourglass-split" : "play-circle")} ${pr ? "Dikerjakan" : "Mulai"}</button>`;
      const tgl =
        tt === null || hariKalender(tt) === 0
          ? ""
          : new Date(tt).toLocaleDateString("id-ID", {
              weekday: "short",
              day: "numeric",
              month: "short",
            }) + " · ";
      return (
        `<div class="fk-card${sd ? " done" : ""}" style="border-left-color:${w.bar};--i:${Math.min(i || 0, 10)}">` +
        `<input type="checkbox" class="fk-chk" data-id="${esc(d.id)}"${sd ? " checked" : ""}${d.selesai || kirim[d.id] ? ' disabled title="Selesai di Moodle"' : ' title="Tandai selesai"'}>` +
        (tt === null
          ? ""
          : `<div class="fk-time">${ic("clock")} ${tgl}${fmtJam(tt)}</div>`) +
        `<div class="fk-main"><a class="fk-name" href="${esc(d.url)}">${esc(d.nama)}</a>` +
        (d.jenis === "perkiraan"
          ? ` <span class="fk-tag" style="background:#eef0f3;color:#475467">${ic("hourglass-split")} perkiraan</span>`
          : "") +
        `<div class="fk-meta fk-sub">${d.course ? `<span class="fk-crs" style="background:${w.bg};color:${w.fg}">${esc(d.course)}</span>` : ""}${d.desc ? " · " + esc(d.desc) : ""}</div></div>` +
        `<div class="fk-extra"><span class="fk-badge" style="background:${L.bg};color:${L.fg}">${ic(L.ic)} ${esc(L.t)}</span>${mulai}${tombol}</div></div>`
      );
    }
    const daftar = (arr) => arr.map((d, i) => kartu(d, i)).join("");
    const GRUP = [
      ["ter", "Terlewat", "exclamation-triangle-fill", "red"],
      ["hari", "Hari ini", "hourglass-split", "orange"],
      ["besok", "Besok", "sunrise", "yellow"],
      ["minggu", "Minggu ini", "calendar-week", "blue"],
      ["lain", "Selanjutnya", "calendar-check", "green"],
      ["tbd", "Tanggal tidak diketahui", "calendar-x", "grey"],
    ];

    function kunciGrup(ts) {
      if (ts === null) return "tbd";
      if (ts < Date.now()) return "ter";
      const hk = hariKalender(ts);
      return hk === 0
        ? "hari"
        : hk === 1
          ? "besok"
          : hk <= 7
            ? "minggu"
            : "lain";
    }
    // Kartu dikelompokkan per waktu; tiap grup bisa dilipat
    function kelompok(arr) {
      return GRUP.map((g) => {
        const it = arr.filter((d) => kunciGrup(d.ts) === g[0]);
        if (!it.length) return "";
        const buka = !tutup[g[0]],
          T = TONE[g[3]];
        return (
          `<div class="fk-group"><button type="button" class="fk-btn" data-grup="${g[0]}" aria-expanded="${buka}"><span style="color:${T[1]};display:inline-flex">${ic(g[2])}</span> ${g[1]} ${ic(buka ? "chevron-up" : "chevron-down")}</button></div>` +
          (buka ? daftar(it) : "")
        );
      }).join("");
    }
    const tombolLipat = (id, icon, teks, n, buka) =>
      `<div style="margin-top:12px"><button type="button" class="fk-btn" id="${id}">${ic(icon)} ${teks} <span class="fk-cnt">(${n})</span> ${ic(buka ? "chevron-up" : "chevron-down")}</button></div>`;

    function renderChips(mine) {
      const now = Date.now(),
        c = {
          ter: 0,
          hari: 0,
          besok: 0,
          lain: 0,
        };
      const aktif = mine.filter((d) => !isDone(d) && d.ts !== null);
      aktif.forEach((d) => {
        const hk = hariKalender(d.ts);
        if (d.ts < now) c.ter++;
        else if (hk === 0) c.hari++;
        else if (hk === 1) c.besok++;
        else c.lain++;
      });
      const chip = (i, t, n, tone) =>
        n
          ? `<span class="fk-chip" style="background:${TONE[tone][0]};color:${TONE[tone][1]}">${ic(i)} ${t} ${n}</span>`
          : "";
      const nd = mine.filter((d) => !isDone(d) && d.jenis === "nodate").length,
        nc = mine.filter((d) => !isDone(d) && d.jenis === "cek").length;
      $("fk-chips").innerHTML =
        !aktif.length && !nd && !nc && lastSemua.length
          ? chip("check-circle-fill", "Semua beres", " ", "green")
          : chip("exclamation-triangle-fill", "Terlewat", c.ter, "red") +
            chip("hourglass-split", "Hari ini", c.hari, "orange") +
            chip("sunrise", "Besok", c.besok, "yellow") +
            chip("calendar-x", "Tanpa tanggal", nd, "grey") +
            chip("question-circle", "Perlu dicek", nc, "grey");

      const urg = aktif
        .filter((d) => d.ts > now && d.ts - now < AMBANG_NOTIF_JAM * 36e5)
        .sort(urut);
      $("fk-urgent").innerHTML = urg.length
        ? `<div class="fk-urgent" data-goto="tugas">${ic("alarm-fill")}<div><b>Deadline segera:</b> ${urg
            .slice(0, 3)
            .map((d) => esc(d.nama) + " (" + esc(label(d.ts).t) + ")")
            .join(
              " · ",
            )}${urg.length > 3 ? " · +" + (urg.length - 3) + " lagi" : ""}</div></div>`
        : c.ter
          ? `<div class="fk-urgent" data-goto="tugas">${ic("exclamation-triangle-fill")}<div><b>${c.ter} tugas terlewat.</b> Ketuk untuk melihat.</div></div>`
          : "";
      const nJudul = c.ter + c.hari;
      document.title =
        nJudul > 0 ? `(${nJudul}) Tugas hari ini | ${judulAsli}` : judulAsli;
    }

    function renderTugas(semua) {
      const f = semua.filter(lolos).sort(urut);
      const aL = f.filter(
          (d) => !isDone(d) && d.jenis !== "nodate" && d.jenis !== "cek",
        ),
        nL = f.filter((d) => !isDone(d) && d.jenis === "nodate"),
        cL = f
          .filter((d) => !isDone(d) && d.jenis === "cek")
          .sort((a, b) => (b.tsAsli || 0) - (a.tsAsli || 0)),
        dL = f.filter(isDone);
      const memuat =
        !semua.length &&
        !timelineGagal &&
        (extraStatus === "idle" || extraStatus === "loading");
      $("fk-err").innerHTML = pesanError();
      $("fk-list").innerHTML = memuat
        ? skel(3)
        : aL.length
          ? kelompok(aL)
          : `<div class="fk-empty">${ic("emoji-smile")}${cache.length ? "Tidak ada tugas yang cocok." : "Belum ada tugas di Timeline."}</div>`;
      $("fk-cekwrap").innerHTML = cL.length
        ? tombolLipat(
            "fk-togglecek",
            "question-circle",
            "Perlu dicek",
            cL.length,
            showCek,
          ) +
          (showCek
            ? '<div class="fk-sub" style="margin:6px 0">Tenggatnya sudah lewat, tetapi status pengirimannya belum bisa dipastikan. Centang kalau sudah kamu kerjakan.</div>' +
              daftar(cL)
            : "")
        : "";
      $("fk-donewrap").innerHTML = dL.length
        ? tombolLipat(
            "fk-toggledone",
            "check2-circle",
            "Selesai",
            dL.length,
            showDone,
          ) + (showDone ? daftar(dL) : "")
        : "";
      $("fk-nodatewrap").innerHTML =
        nL.length || extraStatus === "loading"
          ? tombolLipat(
              "fk-togglenodate",
              "calendar-x",
              "Belum ada tanggal",
              nL.length,
              showNodate,
            ) +
            (extraStatus === "loading"
              ? ' <span class="fk-sub">memeriksa...</span>'
              : "") +
            (showNodate && nL.length
              ? `<div style="margin-top:8px">${nL.map((d) => kartu(d)).join("")}</div>`
              : "")
          : "";
      if (animNext.tugas) {
        efekMasuk($("fk-list"));
        animNext.tugas = false;
      }
    }

    // ===== MATERI MINGGU INI =====
    function renderMateri() {
      const memuat =
        !daftarMateri.length &&
        (extraStatus === "idle" || extraStatus === "loading");
      materiEl.innerHTML = daftarMateri.length
        ? daftarMateri
            .map((m, i) => {
              const w = warnaMatkul(m.course);
              return (
                `<div class="fk-jday" style="--i:${Math.min(i, 10)};border-left:3px solid ${w.bar}"><div class="fk-mh"><strong style="color:${w.fg}">${esc(m.course.split("/")[0].trim())}</strong><br>` +
                `<span class="fk-sub">${ic("bookmark")} ${esc(m.judul || "Minggu ini")}</span></div><div class="fk-jbody">` +
                m.items
                  .map(
                    (it) =>
                      `<div class="fk-mi">${ic(it.ic)}<a href="${esc(it.url)}">${esc(it.nama)}</a></div>`,
                  )
                  .join("") +
                "</div></div>"
              );
            })
            .join("")
        : memuat
          ? skel(2)
          : pesanError() +
            `<div class="fk-empty">${ic("journal-bookmark")}Belum ada materi di minggu ini.</div>`;
      if (animNext.materi) {
        efekMasuk(materiEl);
        animNext.materi = false;
      }
    }

    // ===== GRAFIK =====
    function statTugas() {
      const mine = lastSemua.filter(milikku),
        now = Date.now(),
        sel = mine.filter(isDone).length,
        pro = mine.filter((d) => !isDone(d) && proses[d.id]).length;
      return {
        mine,
        sel,
        pro,
        tot: mine.length,
        bel: mine.length - sel - pro,
        pct: mine.length ? Math.round((sel / mine.length) * 100) : 0,
        ter: mine.filter((d) => !isDone(d) && d.ts !== null && d.ts < now)
          .length,
      };
    }
    // Streak = tugas selesai berturut-turut sebelum tenggat; target = jumlah selesai sejak Senin
    function statStreak() {
      const r = Object.keys(rek)
        .map((k) => rek[k])
        .sort((a, b) => a[0] - b[0]);
      let run = 0,
        best = 0;
      r.forEach((x) => {
        run = x[1] ? run + 1 : 0;
        best = Math.max(best, run);
      });
      const n = new Date(),
        sen = new Date(
          n.getFullYear(),
          n.getMonth(),
          n.getDate() - ((n.getDay() + 6) % 7),
        ).getTime();
      return {
        streak: run,
        best,
        minggu: r.filter((x) => x[0] >= sen).length,
      };
    }

    function htmlStreak() {
      const st = statStreak(),
        pm = Math.min(100, (st.minggu / TARGET_MINGGUAN) * 100);
      return (
        `<div class="fk-streak"><div class="fk-sr"><span>${ic("fire")} Streak tepat waktu</span><b>${st.streak}</b></div>` +
        `<div class="fk-sr"><span>${ic("trophy")} Terbaik</span><b>${st.best}</b></div>` +
        `<div class="fk-sr"><span>${ic("bullseye")} Target minggu ini</span><b>${st.minggu}/${TARGET_MINGGUAN}</b></div>` +
        `<div class="fk-bar"><i style="width:${pm}%;background:var(--pro)"></i></div></div>`
      );
    }

    function renderGrafik() {
      const s = statTugas(),
        C = 2 * Math.PI * 44;
      const seg = [
        ["donut", "pie-chart", "Lingkar"],
        ["bar", "bar-chart-line", "Batang"],
      ]
        .map(
          (m) =>
            `<button type="button" class="fk-btn${m[0] === chartMode ? " go" : ""}" data-mode="${m[0]}">${ic(m[1])} ${m[2]}</button>`,
        )
        .join("");
      const bar = (n, mx, warna) =>
        `<div class="fk-bl2"><div class="fk-bar"><i style="width:${(n / mx) * 100}%;background:${warna}"></i></div><b>${n}</b></div>`;
      let body;
      if (!s.tot)
        body = `<div class="fk-empty">${ic("bar-chart")}Belum ada tugas untuk ditampilkan.</div>`;
      else if (chartMode === "donut") {
        const arc = (n, warna) =>
          `<circle class="fk-arc" cx="60" cy="60" r="44" stroke="${warna}" style="--c:${C};stroke-dasharray:${(C * n) / s.tot} ${C}"/>`;
        body =
          `<div class="fk-donut"><svg viewBox="0 0 120 120" role="img" aria-label="${s.sel} dari ${s.tot} tugas selesai">` +
          `<circle cx="60" cy="60" r="44" stroke="#2f6fed"/>${s.pro ? arc(s.sel + s.pro, "#f79009") : ""}${arc(s.sel, "#12b76a")}</svg>` +
          `<div class="mid"><b>${s.pct}%</b><span>selesai</span></div></div>`;
      } else {
        const g = {};
        s.mine.forEach((d) => {
          const k = bersih(d.course.split("/")[0]) || "Lainnya";
          (g[k] = g[k] || {
            s: 0,
            p: 0,
            b: 0,
          })[isDone(d) ? "s" : proses[d.id] ? "p" : "b"]++;
        });
        const mx = Math.max.apply(
          null,
          Object.keys(g).map((k) => Math.max(g[k].s, g[k].p, g[k].b, 1)),
        );
        body = Object.keys(g)
          .map(
            (k, i) =>
              `<div class="fk-brow" style="--i:${Math.min(i, 10)}"><div class="fk-bl">${esc(k)}</div>${bar(g[k].s, mx, "var(--ok)")}${s.pro ? bar(g[k].p, mx, "var(--pro)") : ""}${bar(g[k].b, mx, "var(--bel)")}</div>`,
          )
          .join("");
      }
      grafikEl.innerHTML =
        `<div class="fk-seg">${seg}</div>${body}` +
        `<div class="fk-lg"><span><i class="sq" style="background:var(--ok)"></i>Selesai ${s.sel}</span>${s.pro ? `<span><i class="sq" style="background:var(--pro)"></i>Dikerjakan ${s.pro}</span>` : ""}<span><i class="sq" style="background:var(--bel)"></i>Belum ${s.bel}</span>` +
        (s.ter
          ? `<span class="fk-tag" style="background:${TONE.red[0]};color:${TONE.red[1]}">${ic("exclamation-triangle-fill")} ${s.ter} terlewat</span>`
          : "") +
        "</div>" +
        htmlStreak();
      if (animNext.grafik) {
        efekMasuk(grafikEl);
        animNext.grafik = false;
      }
    }

    function pesanGrafik() {
      const s = statTugas();
      if (!s.tot)
        return {
          msg: "Belum ada tugas untuk dihitung.",
          mood: "neutral",
        };
      if (s.pct === 100)
        return {
          msg: "Semua tugas selesai, 100%! Kamu luar biasa.",
          mood: "cheer",
        };
      return {
        msg: `${s.sel} dari ${s.tot} tugas selesai (${s.pct}%).${s.pro ? ` ${s.pro} sedang dikerjakan.` : ""}${s.ter ? ` Ada ${s.ter} yang terlewat, ayo kejar.` : " Terus semangat!"}`,
        mood: s.ter ? "worry" : s.pct >= 50 ? "happy" : "neutral",
      };
    }

    // ===== PEMANDU (HOOT) =====
    const PESAN_TAB = {
      tugas:
        "Semua tugasmu ada di sini. Kotak kecil di pojok tab ini untuk menampilkan semua kelas.",
      materi:
        "Ini materi minggu ini dari tiap course. Ketuk judulnya untuk membuka.",
      jadwal:
        "Jadwal kuliah lengkap ada di sini, plus tombol WA dosen. Ketuk nama hari untuk membuka.",
    };

    function setMood(m) {
      if (gTidur) m = "sleep";
      gMood = m;
      gSvg.setAttribute("class", "fk-mascot m-" + m);
      guide.className =
        "fk-guide" +
        (gMin ? " min" : "") +
        (m === "worry" || m === "panic"
          ? " g-worry"
          : m === "happy" || m === "cheer" || m === "elus" || m === "siap"
            ? " g-happy"
            : "");
    }

    function katakan(msg, mood) {
      setMood(mood);
      if (msg === gMsg) return;
      gMsg = msg;
      clearInterval(gTyp);
      anim(gBubble, "fk-pop", 300);
      if (REDUCE) {
        gText.textContent = msg;
        return;
      }
      let i = 0;
      gText.textContent = "";
      gTyp = setInterval(() => {
        i += 2;
        gText.textContent = msg.slice(0, i);
        if (i >= msg.length) clearInterval(gTyp);
      }, 22);
    }

    function sementara(msg, mood, ms) {
      gTemp = Date.now() + ms;
      katakan(msg, mood);
      clearTimeout(gTimer);
      gTimer = setTimeout(() => {
        gTemp = 0;
        renderGuide();
      }, ms);
    }

    function renderGuide() {
      if (gTidur || menguap || Date.now() < gTemp) return;
      const p = pesanIdle();
      katakan(p.msg, p.mood);
    }

    function pesanIdle() {
      const now = Date.now(),
        h = new Date().getHours();
      if (fokusAktif())
        return fokus.fase === "fokus"
          ? {
              msg: "Fokus dulu ya. Aku jagain kamu di sini.",
              mood: "fokus",
            }
          : {
              msg: "Waktunya istirahat. Minum dulu, regangkan badan.",
              mood: "happy",
            };
      const kn = kuliahNext(),
        mntNow = new Date().getHours() * 60 + new Date().getMinutes();
      if (kn && kn.i === 0 && kn.jalan)
        return kn.k.tipe === "Praktikum"
          ? {
              msg: `Praktikum ${kn.k.nama} lagi jalan. Aku ikut ngetik, semangat!`,
              mood: "ngetik",
            }
          : {
              msg: `${kn.k.nama} sedang berlangsung. Aku diam dulu ya, supaya kamu fokus.`,
              mood: "tenang",
            };
      if (kn && kn.i === 0 && !kn.jalan && kn.k.s - mntNow <= 10)
        return {
          msg: `${kn.k.nama} mulai ${Math.max(1, kn.k.s - mntNow)} menit lagi! Tasku sudah siap, ayo berangkat.`,
          mood: "siap",
        };
      if (
        !lastSemua.length &&
        (extraStatus === "idle" || extraStatus === "loading")
      )
        return {
          msg: "Sebentar, aku lagi memeriksa tugasmu...",
          mood: "neutral",
        };
      const aktif = lastSemua
        .filter(milikku)
        .filter((d) => !isDone(d) && d.ts !== null)
        .sort(urut);
      const ter = aktif.filter((d) => d.ts < now),
        urg = aktif.filter(
          (d) => d.ts > now && d.ts - now < AMBANG_NOTIF_JAM * 36e5,
        );
      if (urg.length)
        return {
          msg: `Awas, "${urg[0].nama}" ${label(urg[0].ts).t.toLowerCase()}. Kerjakan yang ini dulu ya.`,
          mood: urg[0].ts - now < 36e5 ? "panic" : "worry",
        };
      if (ter.length)
        return {
          msg: `${ter.length} tugas sudah terlewat. Mulai dari "${ter[ter.length - 1].nama}", yang paling baru.`,
          mood: "worry",
        };
      if (extraGagal || timelineGagal)
        return {
          msg: "Aku gagal memuat sebagian data. Ketuk Coba lagi ya.",
          mood: "worry",
        };
      if (h >= 23 || h < 5)
        return {
          msg: "Sudah larut. Simpan tenaga, besok dilanjut lagi ya.",
          mood: "sleep",
        };
      const nd = lastSemua
        .filter(milikku)
        .filter(
          (d) => !isDone(d) && (d.jenis === "nodate" || d.jenis === "cek"),
        ).length;
      if (!aktif.length)
        return nd
          ? {
              msg: `Ada ${nd} tugas tanpa tanggal atau perlu dicek. Lihat dulu supaya tidak ada yang tertinggal.`,
              mood: "worry",
            }
          : {
              msg: "Semua tugas beres! Waktunya istirahat.",
              mood: "happy",
            };
      const hk = aktif.find((d) => d.ts > now) || aktif[0];
      return {
        msg: `Tugas terdekat: "${hk.nama}", ${label(hk.ts).t.toLowerCase()}.`,
        mood: "neutral",
      };
    }

    function kuliahNext() {
      const jd = bacaJadwal(),
        now = new Date(),
        mnt = now.getHours() * 60 + now.getMinutes();
      for (let i = 0; i < 8; i++) {
        const idx = (now.getDay() + i) % 7;
        for (const k of jd[HARI[idx]] || []) {
          if (i === 0 && mnt >= k.e) continue;
          return {
            k,
            i,
            idx,
            jalan: i === 0 && mnt >= k.s,
          };
        }
      }
      return null;
    }

    function kuliahBerikut() {
      const n = kuliahNext();
      if (!n) return "";
      return n.jalan
        ? `Sedang berlangsung: ${n.k.nama} sampai ${hhmm(n.k.e)}.`
        : `Kuliah berikutnya: ${n.k.nama}, ${n.i === 0 ? "hari ini" : n.i === 1 ? "besok" : HARI_TAMPIL[n.idx]} pukul ${hhmm(n.k.s)}.`;
    }

    function tips() {
      const a = [pesanIdle(), pesanGrafik()],
        kb = kuliahBerikut();
      if (kb)
        a.push({
          msg: kb,
          mood: "neutral",
        });
      pesanOutfit().forEach((m) =>
        a.push({
          msg: m,
          mood: "happy",
        }),
      );
      a.push(
        {
          msg: "Tahan aku beberapa detik, aku suka dielus. Ketuk dua kali, aku salto!",
          mood: "happy",
        },
        {
          msg: "Seret aku ke kartu tugas, nanti kutandai Dikerjakan dan kutemani.",
          mood: "happy",
        },
        {
          msg: "Mau fokus? Ketuk tombol Temani aku fokus, aku jagain 25 menit.",
          mood: "fokus",
        },
      );
      if (perchId)
        a.push({
          msg: "Aku kecil yang bertengger di kartu itu menandai tugas dengan tenggat paling dekat. Kerjakan yang itu dulu, ya!",
          mood: "neutral",
        });
      a.push(
        {
          msg: "Tab Materi menampilkan bahan kuliah minggu ini.",
          mood: "happy",
        },
        {
          msg: "Centang tugas kalau sudah selesai, aku ikut senang!",
          mood: "happy",
        },
        {
          msg: "Coba tab Grafik untuk melihat progres tugasmu.",
          mood: "happy",
        },
        {
          msg: "Ada tugas yang tidak muncul? Centang kotak kecil di pojok tab Tugas untuk melihat semua kelas.",
          mood: "neutral",
        },
        {
          msg: "Tab Jadwal punya tombol WA untuk menghubungi dosen.",
          mood: "neutral",
        },
        {
          msg: "Ketuk gerigi di kanan atas untuk ganti warna tema dan aksesori-ku.",
          mood: "happy",
        },
      );
      return a;
    }
    // Ketuk Hoot: ganti saran. Ketuk cepat 5x = Hoot pusing.
    function ketukMaskot() {
      if (gMin) {
        gMin = false;
        store.set("fk_gmin", "0");
        setMood(gMood);
      } else {
        const n = Date.now();
        taps = taps.filter((t) => n - t < 2000);
        taps.push(n);
        if (taps.length >= 5) {
          taps = [];
          anim(mBtn, "fk-spin", 800);
          sementara("Aduh, pusing! Pelan-pelan dong...", "dizzy", 4000);
          return;
        }
        if (taps.length >= 2 && n - taps[taps.length - 2] < 350) {
          sementara(pilih(["Hup! Salto!", "Ta-da! Lihat aku!"]), "happy", 3500);
          anim(gSvg, "fk-flip", 800);
          return;
        }
        const t = tips();
        tipIdx = (tipIdx + 1) % t.length;
        sementara(t[tipIdx].msg, t[tipIdx].mood, 9000);
      }
      anim(mBtn, "fk-wig", 500);
      anim(gSvg, "fk-flap", 1300);
    }
    // Mata Hoot mengikuti kursor / jari
    let raf = 0;
    document.addEventListener(
      "pointermove",
      (e) => {
        if (raf || REDUCE) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          const r = gSvg.getBoundingClientRect(),
            dx = e.clientX - (r.left + r.width / 2),
            dy = e.clientY - (r.top + r.height / 2);
          const d = Math.hypot(dx, dy) || 1,
            k = (Math.min(d, 120) / 120) * 2.2;
          gSvg.style.setProperty("--px", (dx / d) * k + "px");
          gSvg.style.setProperty("--py", (dy / d) * k + "px");
          if (perchSvg) {
            perchSvg.style.setProperty("--px", (dx / d) * k + "px");
            perchSvg.style.setProperty("--py", (dy / d) * k + "px");
          }
        });
      },
      {
        passive: true,
      },
    );
    // ===== INTERAKSI & ANIMASI HOOT =====
    const fokusAktif = () => !!fokus.fase && fokus.akhir > Date.now();

    // --- Tidur saat lama tidak disentuh ---
    function aktif() {
      lastAct = Date.now();
      if (gTidur) bangun();
      else if (menguap) {
        menguap = false;
        gTemp = 0;
        renderGuide();
      }
    }

    function bangun() {
      gTidur = false;
      gTemp = 0;
      clearTimeout(gTimer);
      sementara(
        pilih(["Eh! Aku ketiduran ya?", "Hah?! Aku nggak tidur kok."]),
        "neutral",
        3500,
      );
      anim(gSvg, "fk-startle", 800);
    }

    function cekIdle() {
      if (
        document.hidden ||
        !isengOn ||
        gTidur ||
        menguap ||
        fokusAktif() ||
        drag ||
        elusT
      )
        return;
      if (Date.now() - lastAct < IDLE_TIDUR_DETIK * 1000) return;
      menguap = true;
      gTemp = 0;
      clearTimeout(gTimer);
      katakan("Hoaaam... ngantuk juga ya.", "yawn");
      setTimeout(() => {
        if (!menguap) return;
        menguap = false;
        if (Date.now() - lastAct < IDLE_TIDUR_DETIK * 1000) return;
        gTidur = true;
        katakan("Zzz...", "sleep");
      }, 2400);
    }
    setInterval(cekIdle, 5000);
    [
      "pointerdown",
      "pointermove",
      "keydown",
      "touchstart",
      "wheel",
      "scroll",
    ].forEach((ev) =>
      document.addEventListener(ev, aktif, {
        passive: true,
        capture: true,
      }),
    );

    // --- Gerakan iseng acak ---
    function iseng() {
      if (
        !isengOn ||
        REDUCE ||
        gTidur ||
        menguap ||
        drag ||
        elusT ||
        fokusAktif()
      )
        return;
      if (gMood !== "neutral" || Date.now() < gTemp || Math.random() < 0.4)
        return;
      const pool = ["tilt", "flap", "sneeze", "look", "preen", "peek"];
      if (outfit.f.indexOf("party") >= 0) pool.push("dance", "dance");
      const j = pilih(pool);
      if (j === "tilt") anim(gSvg, "fk-tilt", 1300);
      else if (j === "flap") anim(gSvg, "fk-flap", 1300);
      else if (j === "sneeze") {
        sementara("Hacii! ...maaf ya.", "neutral", 2500);
        anim(gSvg, "fk-sneeze", 900);
      } else if (j === "look") {
        gSvg.style.setProperty("--py", "0px");
        gSvg.style.setProperty("--px", "-2.2px");
        setTimeout(() => gSvg.style.setProperty("--px", "2.2px"), 650);
        setTimeout(() => gSvg.style.setProperty("--px", "0px"), 1300);
      } else if (j === "preen") anim(gSvg, "fk-preen", 1400);
      else if (j === "peek") anim(mBtn, "fk-peek", 2400);
      else if (j === "dance") {
        sementara("Kuliah beres, waktunya joget!", "happy", 3000);
        anim(gSvg, "fk-dance", 1800);
      }
    }
    setInterval(iseng, 8000);

    // --- Dielus (tahan Hoot), diseret ke kartu tugas ---
    function hati() {
      const pr = panel.getBoundingClientRect(),
        r = gSvg.getBoundingClientRect(),
        s = document.createElement("span");
      s.className = "fk-heart";
      s.innerHTML = ic("heart-fill");
      s.style.cssText = `left:${r.left - pr.left + r.width / 2 + (Math.random() * 30 - 15)}px;top:${r.top - pr.top}px;--dx:${Math.random() * 24 - 12}px`;
      panel.appendChild(s);
      setTimeout(() => s.remove(), 1400);
    }

    function mulaiElus() {
      tahan = true;
      sementara("Hehe... geli, tapi enak.", "elus", 60000);
      hati();
      elusT = setInterval(hati, 450);
    }

    function akhiriElus() {
      clearInterval(elusT);
      elusT = null;
      tahan = false;
      sementara(
        pilih([
          "Terima kasih ya! Aku jadi semangat.",
          "Hehe, lagi dong... nanti.",
        ]),
        "happy",
        3500,
      );
    }

    function gerakSeret(e) {
      seret.box.style.transform = `translate(${e.clientX - 23}px,${e.clientY - 30}px)`;
      const el = document.elementFromPoint(e.clientX, e.clientY),
        c = el && el.closest ? el.closest(".fk-card") : null;
      const ok =
        !!c &&
        panel.contains(c) &&
        !c.classList.contains("done") &&
        !!c.querySelector(".fk-chk");
      if (seret.target && seret.target !== c)
        seret.target.classList.remove("fk-target");
      seret.target = ok ? c : null;
      if (ok) c.classList.add("fk-target");
    }

    function mulaiSeret(e) {
      drag.mulai = true;
      const h = buatHoot("m-happy fk-flap");
      h.box.className = "fk-fly";
      salinTampilan(h.svg);
      panel.appendChild(h.box);
      mBtn.style.visibility = "hidden";
      seret = {
        box: h.box,
        target: null,
      };
      sementara("Wiii! Mau ke tugas yang mana?", "happy", 20000);
      gerakSeret(e);
    }

    function akhiriSeret() {
      const s = seret;
      seret = null;
      if (!s) return;
      if (s.target) s.target.classList.remove("fk-target");
      mBtn.style.visibility = "";
      s.box.remove();
      const tg = s.target;
      if (!tg) {
        sementara("Hmm, jatuhkan aku di kartu tugas ya.", "neutral", 4000);
        anim(mBtn, "fk-wig", 500);
        return;
      }
      const id = tg.querySelector(".fk-chk").dataset.id,
        item = lastSemua.find((x) => x.id === id);
      if (proses[id])
        return sementara(
          "Yang itu sudah kamu kerjakan. Semangat!",
          "happy",
          4000,
        );
      proses[id] = Date.now();
      store.set("fk_proses", JSON.stringify(proses));
      animNext.grafik = true;
      perchPaksa = id;
      clearTimeout(perchPaksaT);
      perchPaksaT = setTimeout(() => {
        perchPaksa = null;
        posisiPerch();
      }, 12000);
      render();
      sementara(
        `Oke, aku temani kamu mengerjakan "${item ? item.nama : "tugas itu"}"!`,
        "happy",
        5000,
      );
    }
    mBtn.addEventListener("contextmenu", (e) => e.preventDefault());
    mBtn.addEventListener("pointerdown", (e) => {
      if (e.button) return;
      drag = {
        x: e.clientX,
        y: e.clientY,
        mulai: false,
      };
      tahan = false;
      clearTimeout(holdT);
      if (!gMin)
        holdT = setTimeout(() => {
          if (drag && !drag.mulai) mulaiElus();
        }, 800);
    });
    document.addEventListener(
      "pointermove",
      (e) => {
        if (!drag) return;
        if (drag.mulai) return gerakSeret(e);
        if (tahan) return;
        if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) {
          clearTimeout(holdT);
          mulaiSeret(e);
        }
      },
      {
        passive: true,
      },
    );
    const lepas = () => {
      if (!drag) return;
      clearTimeout(holdT);
      const d = drag;
      drag = null;
      if (d.mulai) akhiriSeret();
      else if (tahan) akhiriElus();
      else return;
      skipClick = true;
      setTimeout(() => {
        skipClick = false;
      }, 80);
    };
    document.addEventListener("pointerup", lepas);
    document.addEventListener("pointercancel", lepas);

    // --- Hoot mengintip kartu dan kolom cari ---
    let kartuIntip = null,
      intipTs = 0,
      cariTs = 0;

    function lirikKe(el) {
      const r = gSvg.getBoundingClientRect(),
        q = el.getBoundingClientRect(),
        dx = q.left + q.width / 2 - (r.left + r.width / 2),
        dy = q.top + q.height / 2 - (r.top + r.height / 2),
        d = Math.hypot(dx, dy) || 1;
      gSvg.style.setProperty("--px", (dx / d) * 2.2 + "px");
      gSvg.style.setProperty("--py", (dy / d) * 2.2 + "px");
    }

    function intipCari() {
      lirikKe(inQ);
      const n = Date.now();
      if (n - cariTs < 1500 || gTidur || gMood !== "neutral") return;
      cariTs = n;
      anim(gSvg, "fk-tilt", 1000);
    }
    panel.addEventListener("pointerover", (e) => {
      if (seret) return;
      const c = e.target.closest ? e.target.closest(".fk-card") : null;
      if (!c || c === kartuIntip) return;
      kartuIntip = c;
      const n = Date.now();
      if (n - intipTs < 3000 || gTidur || gMood !== "neutral") return;
      intipTs = n;
      anim(gSvg, "fk-tilt", 1000);
    });

    // --- Mode fokus (Pomodoro) ---
    const simpanFokus = () => store.set("fk_focus", JSON.stringify(fokus));
    const fmtMS = (ms) => {
      const s = Math.max(0, Math.ceil(ms / 1000));
      return pad(Math.floor(s / 60)) + ":" + pad(s % 60);
    };

    function kabari(j, b) {
      try {
        if ("Notification" in window && Notification.permission === "granted")
          new Notification(j, {
            body: b,
          });
      } catch (e) {}
    }

    function renderFokus() {
      const w = $("fk-focuswrap");
      if (!w) return;
      if (!fokusAktif()) {
        w.innerHTML = `<div style="margin:0 0 8px"><button type="button" class="fk-btn go" data-fokus="mulai">${ic("stopwatch")} Temani aku fokus (${FOKUS_MENIT} menit)</button>${fokus.sesi ? ` <span class="fk-sub">${fokus.sesi} sesi selesai hari ini</span>` : ""}</div>`;
        return;
      }
      const f = fokus.fase === "fokus",
        sisa = fokus.akhir - Date.now();
      w.innerHTML =
        `<div class="fk-focus"><div class="fk-sr"><span>${ic(f ? "bullseye" : "cup-hot")} ${f ? "Fokus" : "Istirahat"}</span><b id="fk-ftime">${fmtMS(sisa)}</b></div>` +
        `<div class="fk-bar"><i id="fk-fbar" style="width:${100 - (sisa / fokus.total) * 100}%;background:${f ? "var(--brand)" : "var(--ok)"}"></i></div>` +
        `<div class="fk-btns"><button type="button" class="fk-btn" data-fokus="lewati">${ic("skip-forward")} Lewati</button><button type="button" class="fk-btn" data-fokus="stop">${ic("x-circle")} Berhenti</button></div></div>`;
    }

    function selesaiFase(alami) {
      if (fokus.fase === "fokus") {
        if (alami) fokus.sesi++;
        const mnt =
          alami && fokus.sesi % SESI_PANJANG === 0
            ? ISTIRAHAT_PANJANG
            : ISTIRAHAT_MENIT;
        fokus.fase = "istirahat";
        fokus.total = mnt * 6e4;
        fokus.akhir = Date.now() + fokus.total;
        kabari("Sesi fokus selesai", `Istirahat ${mnt} menit dulu.`);
        const r = gSvg.getBoundingClientRect();
        konfeti(r.left + r.width / 2, r.top + r.height / 2, 24);
        sementara(
          `Sesi fokus selesai! Istirahat ${mnt} menit, ini kopimu.`,
          "cheer",
          6000,
        );
      } else {
        fokus.fase = "";
        fokus.akhir = 0;
        kabari("Istirahat selesai", "Siap lanjut sesi berikutnya?");
        sementara(
          "Istirahat selesai. Mau lanjut sesi berikutnya?",
          "happy",
          6000,
        );
      }
      simpanFokus();
      renderFokus();
      terapkanOutfit();
    }

    function aksiFokus(a) {
      if (fokus.hari !== new Date().toDateString()) {
        fokus.sesi = 0;
        fokus.hari = new Date().toDateString();
      }
      if (a === "mulai") {
        fokus.fase = "fokus";
        fokus.total = FOKUS_MENIT * 6e4;
        fokus.akhir = Date.now() + fokus.total;
        simpanFokus();
        renderFokus();
        terapkanOutfit();
        sementara(
          `Oke, aku temani. Fokus ${FOKUS_MENIT} menit ya!`,
          "fokus",
          5000,
        );
      } else if (a === "stop") {
        fokus.fase = "";
        fokus.akhir = 0;
        simpanFokus();
        renderFokus();
        terapkanOutfit();
        sementara(
          "Fokusnya dihentikan. Tidak apa-apa, nanti coba lagi.",
          "neutral",
          4000,
        );
      } else if (a === "lewati") selesaiFase(false);
    }

    function tickFokus() {
      if (!fokus.fase) return;
      const sisa = fokus.akhir - Date.now();
      if (sisa <= 0) return selesaiFase(true);
      const t = $("fk-ftime"),
        b = $("fk-fbar");
      if (t) t.textContent = fmtMS(sisa);
      if (b) b.style.width = 100 - (sisa / fokus.total) * 100 + "%";
    }
    setInterval(tickFokus, 1000);
    renderFokus();

    function konfeti(x, y, n) {
      if (REDUCE) return;
      const pr = panel.getBoundingClientRect(),
        cols = [
          "#2f6fed",
          "#12b76a",
          "#f79009",
          "#f04438",
          "#7a5af8",
          "#fdb022",
        ];
      for (let i = 0; i < n; i++) {
        const s = document.createElement("span"),
          a = Math.random() * Math.PI * 2,
          dist = 40 + Math.random() * 60;
        s.className = "fk-cf";
        s.style.cssText = `left:${x - pr.left}px;top:${y - pr.top}px;background:${cols[i % cols.length]};--dx:${Math.cos(a) * dist}px;--dy:${Math.sin(a) * dist - 20}px;--r:${Math.random() * 540 - 270}deg`;
        panel.appendChild(s);
        setTimeout(() => s.remove(), 1000);
      }
    }

    function reaksiSelesai(item, rc) {
      konfeti(rc.left + rc.width / 2, rc.top + rc.height / 2, 16);
      const sisa = lastSemua
          .filter(milikku)
          .filter((d) => !isDone(d) && d.ts !== null).length,
        st = statStreak();
      const besar = () => {
        const r = gSvg.getBoundingClientRect();
        konfeti(r.left + r.width / 2, r.top + r.height / 2, 36);
      };
      if (!sisa) {
        besar();
        sementara(
          "Semua tugas selesai! Hebat, kamu boleh istirahat sekarang.",
          "cheer",
          8000,
        );
      } else if (st.minggu === TARGET_MINGGUAN) {
        besar();
        sementara(
          `Target mingguan tercapai: ${st.minggu} tugas! Aku bangga padamu.`,
          "cheer",
          8000,
        );
      } else if (st.streak >= 3)
        sementara(
          `Streak ${st.streak} tugas tepat waktu berturut-turut! Pertahankan.`,
          "cheer",
          6000,
        );
      else
        sementara(
          `${pilih(["Mantap! ", "Keren! ", "Satu beres! "])}${item ? `"${item.nama}"` : "Tugas itu"} selesai. Sisa ${sisa} tugas.`,
          "cheer",
          5000,
        );
    }

    function terapkanTema() {
      const t = TEMA[tema] || TEMA.biru;
      [
        "--brand",
        "--brand-soft",
        "--brand-line",
        "--brand-ink",
        "--mc1",
        "--mc2",
      ].forEach((v, i) => panel.style.setProperty(v, t[i]));
      gSvg.dataset.ac = aks;
      Array.prototype.forEach.call(panel.querySelectorAll("[data-tema]"), (b) =>
        b.classList.toggle("on", b.dataset.tema === tema),
      );
      Array.prototype.forEach.call(panel.querySelectorAll("[data-aks]"), (b) =>
        b.classList.toggle("go", b.dataset.aks === aks),
      );
      const bi = $("fk-iseng");
      if (bi) {
        bi.textContent = isengOn ? "Hidup" : "Mati";
        bi.classList.toggle("go", isengOn);
      }
    }

    // ===== PAKAIAN HARIAN, HOOT BERTENGGER, HOOT TERBANG =====
    let outfit = {
        f: [],
        nx: null,
      },
      perchEl = null,
      perchSvg = null,
      perchId = null,
      perchPos = null,
      terbang = false;

    function buatHoot(cls) {
      const d = document.createElement("div");
      d.innerHTML = SVG_MASKOT.replace(' id="fk-mascot"', "");
      const s = d.firstElementChild;
      s.setAttribute("class", "fk-mascot " + cls);
      return {
        box: d,
        svg: s,
      };
    }
    // Salinan Hoot memakai aksesori dan syal yang sama dengan Hoot utama
    function salinTampilan(s) {
      s.dataset.ac = gSvg.dataset.ac || "polos";
      s.dataset.fit = gSvg.dataset.fit || "";
      s.style.setProperty(
        "--scarf",
        gSvg.style.getPropertyValue("--scarf") || "#f79009",
      );
    }

    function terapkanOutfit() {
      const now = new Date(),
        mnt = now.getHours() * 60 + now.getMinutes(),
        hr = now.getDay();
      const sesi = bacaJadwal()[HARI[hr]] || [];
      let ot = OUTFIT_HARI[hr];
      if (!ot && mnt < 300 && OUTFIT_HARI[(hr + 6) % 7] === "party")
        ot = "party";
      else if (
        ot === "party" &&
        !(sesi.length && mnt >= sesi[sesi.length - 1].e)
      )
        ot = null;
      const f = [],
        nx = kuliahNext();
      if (ot === "coffee") f.push("coffee");
      if (ot === "glasses" && aks !== "glasses") f.push("glasses");
      if (ot === "party" && aks !== "cap") f.push("party");
      if (nx && aks !== "bow") {
        f.push("scarf");
        gSvg.style.setProperty("--scarf", warnaMatkul(nx.k.kode).bar);
      }
      if (nx && nx.i === 0 && !nx.jalan && nx.k.s - mnt <= 10) f.push("bag");
      if (nx && nx.i === 0 && nx.jalan && nx.k.tipe === "Praktikum")
        f.push("laptop");
      if (fokusAktif()) {
        if (
          fokus.fase === "fokus" &&
          f.indexOf("glasses") < 0 &&
          aks !== "glasses"
        )
          f.push("glasses");
        if (fokus.fase === "istirahat" && f.indexOf("coffee") < 0)
          f.push("coffee");
      }
      gSvg.dataset.flag = statStreak().minggu >= TARGET_MINGGUAN ? "1" : "0";
      outfit = {
        f,
        nx,
      };
      gSvg.dataset.fit = f.join(" ");
      if (perchSvg) salinTampilan(perchSvg);
    }

    // Hoot kecil bertengger di kartu dengan tenggat terdekat, melompat kalau urutan berubah
    function posisiPerch() {
      if (!perchEl) {
        const h = buatHoot("m-neutral");
        perchEl = h.box;
        perchSvg = h.svg;
        perchEl.className = "fk-perch";
        perchEl.hidden = true;
        panel.appendChild(perchEl);
      }
      const sembunyi = () => {
        perchEl.hidden = true;
        perchId = null;
        perchPos = null;
      };
      if (!HOOT_BERTENGGER || tab !== "tugas") return sembunyi();
      const now = Date.now();
      let t = lastSemua
        .filter(lolos)
        .filter((d) => !isDone(d) && d.ts !== null && d.ts > now)
        .sort(urut)[0];
      if (perchPaksa) {
        const pk = lastSemua.find((d) => d.id === perchPaksa && !isDone(d));
        if (pk) t = pk;
      }
      if (!t) return sembunyi();
      const kartu = Array.prototype.find.call(
        panel.querySelectorAll("#fk-list .fk-card"),
        (c) => {
          const k = c.querySelector(".fk-chk");
          return k && k.dataset.id === t.id;
        },
      );
      const gr = kartu && kartu.previousElementSibling;
      if (!kartu || !gr || !gr.classList.contains("fk-group"))
        return sembunyi();
      const sisaP = t.ts === null ? Infinity : t.ts - now;
      perchSvg.classList.remove("m-worry", "m-neutral", "m-panic");
      perchSvg.classList.add(
        sisaP < 36e5
          ? "m-panic"
          : sisaP < AMBANG_NOTIF_JAM * 36e5
            ? "m-worry"
            : "m-neutral",
      );
      salinTampilan(perchSvg);
      const x = kartu.offsetLeft + kartu.offsetWidth - 44,
        y = kartu.offsetTop - 28;
      const lama = perchPos,
        pindah = !!lama && perchId !== null && perchId !== t.id,
        baru = perchId === null;
      perchEl.hidden = false;
      perchEl.style.left = x + "px";
      perchEl.style.top = y + "px";
      if (!REDUCE && perchEl.animate) {
        if (pindah) {
          const dx = lama.x - x,
            dy = lama.y - y;
          perchEl.animate(
            [
              {
                transform: `translate(${dx}px,${dy}px)`,
              },
              {
                transform: `translate(${dx / 2}px,${dy / 2 - 26}px)`,
                offset: 0.5,
              },
              {
                transform: "translate(0,0)",
              },
            ],
            {
              duration: 520,
              easing: "ease-in-out",
            },
          );
          anim(perchSvg, "fk-flap", 700);
        } else if (baru) {
          perchEl.animate(
            [
              {
                opacity: 0,
                transform: "translateY(-10px)",
              },
              {
                opacity: 1,
                transform: "none",
              },
            ],
            {
              duration: 350,
              easing: "ease-out",
            },
          );
        }
      }
      perchId = t.id;
      perchPos = {
        x,
        y,
      };
    }

    // Hoot terbang: ambil kartu yang baru dicentang, bawa ke tombol Selesai, lalu pulang
    function siapTerbang(chk) {
      if (!HOOT_TERBANG || REDUCE || terbang || !panel.animate) return null;
      const kartu = chk.closest(".fk-card");
      if (!kartu) return null;
      const rc = kartu.getBoundingClientRect();
      if (rc.bottom < 0 || rc.top > window.innerHeight) return null;
      const ghost = kartu.cloneNode(true);
      ghost.classList.remove("done", "fk-popdone");
      ghost.classList.add("fk-ghost");
      Object.assign(ghost.style, {
        width: rc.width + "px",
        height: rc.height + "px",
        transform: `translate(${rc.left}px,${rc.top}px)`,
      });
      const c = ghost.querySelector(".fk-chk");
      if (c) c.checked = true;
      return {
        ghost,
        rc,
      };
    }

    function mulaiTerbang(info) {
      terbang = true;
      const g = info.ghost,
        rc = info.rc,
        W = 46,
        H = 46;
      const hoot = buatHoot("m-happy fk-flap");
      hoot.box.className = "fk-fly";
      salinTampilan(hoot.svg);
      panel.appendChild(g);
      panel.appendChild(hoot.box);
      const r0 = gSvg.getBoundingClientRect(),
        sel = $("fk-toggledone"),
        cnt = sel && sel.querySelector(".fk-cnt"),
        tr = sel && sel.getBoundingClientRect();
      const T =
        tr && tr.bottom > 0 && tr.top < window.innerHeight
          ? [tr.left + tr.width / 2, tr.top + tr.height / 2]
          : null;
      // Angka Selesai baru naik saat kartu dijatuhkan
      if (cnt && T)
        cnt.textContent =
          "(" +
          Math.max(
            0,
            (parseInt(cnt.textContent.replace(/\D/g, ""), 10) || 1) - 1,
          ) +
          ")";
      mBtn.style.visibility = "hidden";
      let beres = false;
      const akhir = () => {
        if (beres) return;
        beres = true;
        terbang = false;
        g.remove();
        hoot.box.remove();
        mBtn.style.visibility = "";
        const b = $("fk-toggledone"),
          c = b && b.querySelector(".fk-cnt");
        if (c)
          c.textContent =
            "(" + lastSemua.filter(lolos).filter(isDone).length + ")";
      };
      const jalan = (el, kf, ms) =>
        new Promise((res) => {
          const a = el.animate(kf, {
            duration: ms,
            easing: "ease-in-out",
            fill: "forwards",
          });
          a.onfinish = res;
          a.oncancel = res;
        });
      const tl = (p, s, o) => {
        const f = {
          transform:
            `translate(${p[0]}px,${p[1]}px)` + (s ? ` scale(${s})` : ""),
        };
        if (o !== undefined) f.offset = o;
        return f;
      };
      const arc = (a, b, up) => [(a[0] + b[0]) / 2, Math.min(a[1], b[1]) - up];
      const pm = [
        r0.left + r0.width / 2 - W / 2,
        r0.top + r0.height / 2 - H / 2,
      ];
      const pk = [rc.left + rc.width / 2 - W / 2, rc.top - H + 12];
      hoot.box.style.transform = `translate(${pm[0]}px,${pm[1]}px)`;
      jalan(hoot.box, [tl(pm), tl(arc(pm, pk, 24), 0, 0.5), tl(pk)], 480)
        .then(() => {
          if (!T)
            return jalan(
              g,
              [
                {
                  opacity: 1,
                },
                {
                  opacity: 0,
                },
              ],
              260,
            );
          const g0 = [rc.left, rc.top],
            g1 = [T[0] - rc.width / 2, T[1] - rc.height / 2],
            h1 = [T[0] - W / 2, T[1] - H - 12];
          jalan(
            g,
            [tl(g0, 1), tl(arc(g0, g1, 60), 0.55, 0.5), tl(g1, 0.08)],
            760,
          );
          return jalan(
            hoot.box,
            [tl(pk), tl(arc(pk, h1, 60), 0, 0.5), tl(h1)],
            760,
          );
        })
        .then(() => {
          g.remove();
          const b = $("fk-toggledone"),
            c = b && b.querySelector(".fk-cnt");
          if (c)
            c.textContent =
              "(" + lastSemua.filter(lolos).filter(isDone).length + ")";
          if (b && T) anim(b, "fk-pop", 300);
          const r1 = gSvg.getBoundingClientRect(),
            pe = [
              r1.left + r1.width / 2 - W / 2,
              r1.top + r1.height / 2 - H / 2,
            ];
          const ps = T ? [T[0] - W / 2, T[1] - H - 12] : pk;
          return jalan(
            hoot.box,
            [tl(ps), tl(arc(ps, pe, 30), 0, 0.5), tl(pe)],
            520,
          );
        })
        .then(akhir, akhir);
      setTimeout(akhir, 4500);
    }

    function cekNotif() {
      if (!("Notification" in window) || Notification.permission !== "granted")
        return;
      const now = Date.now();
      let ubah = false;
      lastSemua.forEach((d) => {
        if (d.ts === null || isDone(d) || !milikku(d) || notified[d.id]) return;
        const df = d.ts - now;
        if (df > 0 && df < AMBANG_NOTIF_JAM * 36e5) {
          notified[d.id] = now;
          ubah = true;
          try {
            const n = new Notification("⏰ Deadline segera", {
              body:
                d.nama +
                " - " +
                label(d.ts).t +
                (d.course ? "\n" + d.course : ""),
              tag: d.id,
            });
            n.onclick = () => {
              try {
                window.focus();
                n.close();
              } catch (e) {}
            };
          } catch (e) {}
        }
      });
      if (ubah) store.set("fk_notif", JSON.stringify(notified));

    function salin(txt, cb) {
      const fb = () => {
        try {
          const ta = document.createElement("textarea");
          ta.value = txt;
          ta.style.cssText = "position:fixed;opacity:0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          cb(ok);
        } catch (e) {
          cb(false);
        }
      };
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(() => cb(true), fb);
      else fb();
    }

    // ===== DETEKSI KELAS OTOMATIS =====
    const ajaxMoodle = (calls) =>
      fetch(
        M.cfg.wwwroot +
          "/lib/ajax/service.php?sesskey=" +
          encodeURIComponent(M.cfg.sesskey),
        {

    function idCourse() {
      const ids = [];
      Array.prototype.forEach.call(
        document.querySelectorAll('a[href*="/course/view.php?id="]'),
        (a) => {
          const m = a.href.match(/course\/view\.php\?id=(\d+)/);
          if (m && ids.indexOf(+m[1]) < 0) ids.push(+m[1]);
        },
      );
      return ids.slice(0, 30);
    }

    function deteksi() {
      if (!hasM()) return Promise.reject("M.cfg tidak tersedia");
      let uid = M.cfg.userId;
      if (!uid) {
        const a = document.querySelector('a[href*="/user/profile.php?id="]'),
          m = a && a.href.match(/id=(\d+)/);
        uid = m && +m[1];
      }
      if (!uid) return Promise.reject("ID pengguna tidak ditemukan");
      const ids = idCourse();
      if (!ids.length)
        return Promise.reject("daftar course tidak ditemukan di halaman");
      return ajaxMoodle(
        ids.map((id, i) => ({
          index: i,
          methodname: "core_group_get_course_user_groups",
          args: {
            courseid: id,
            userid: uid,
          },
        })),
      ).then((j) => {
        const cK = {},
          cS = {},
          nama = [];
        j.forEach((x) => {
          if (!x || x.error || !x.data || !x.data.groups) return;
          x.data.groups.forEach((g) => {
            nama.push(g.name);
            KELAS_LIST.forEach((k) => {
              if (menyebut(g.name, k)) cK[k] = (cK[k] || 0) + 1;
            });
            SHIFT_LIST.forEach((s) => {
              if (menyebut(g.name, s)) cS[s] = (cS[s] || 0) + 1;
            });
          });
        });
        const top = (o) => Object.keys(o).sort((a, b) => o[b] - o[a])[0];
        const k = top(cK),
          s = top(cS);
        if (!k && !s)
          throw nama.length
            ? `nama grup (${nama.slice(0, 3).join(", ")}) tidak cocok dengan daftar kelas/shift`
            : "kamu tidak terdaftar di grup mana pun";
        return {
          k,
          s,
          nama,
        };
      });
    }

    function jalankanDeteksi() {

    // ===== TUGAS TANPA TANGGAL & TENGGAT DARI HALAMAN COURSE =====
    // TIPE_PASTI selalu dianggap tugas. Jenis lain yang punya tenggat juga dianggap tugas.
    // TIPE_STATIS adalah materi biasa. Jika ada jenis aktivitas yang tidak muncul, tambahkan ke TIPE_PASTI.
    const TIPE_PASTI = [
      "assign",
      "quiz",
      "workshop",
      "turnitintooltwo",
      "questionnaire",
    ];
    const TIPE_STATIS = [
      "resource",
      "page",
      "url",
      "folder",
      "label",
      "book",
      "imscp",
      "subsection",
      "qbank",
    ];
    const basis = () =>
      hasM() && M.cfg.wwwroot ? M.cfg.wwwroot : location.origin;
    const sebelum = (t) => /\b(before|until|sebelum|hingga)\b/i.test(t);
    const adaGrup = (t) => /belong to|tergabung|termasuk/i.test(t);

    function tglDari(t) {
      const m = t.match(
        /(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4}),?\s+(\d{1,2})[:.](\d{2})\s*([AaPp][Mm])?/,
      );
      const bln = m && BULAN[m[2].slice(0, 3).toLowerCase()];
      if (!m || bln === undefined) return null;
      let h = +m[4];
      if (m[6]) {
        const pm = /p/i.test(m[6]);
        if (pm && h < 12) h += 12;
        if (!pm && h === 12) h = 0;
      }
      return new Date(+m[3], bln, +m[1], h, +m[5], 0).getTime();
    }

    function grupCocok(t) {
      const i = infoKelas(t);
      return !!(i.kel.length || i.hur.length || i.shf.length) && cocokInfo(i);
    }

    function bacaAkses(av) {
      if (!av) return null;
      const out = {
          umum: [],
          blok: [],
        },
        ul = av.querySelector("ul");
      const tgl = (t) => (sebelum(t) ? tglDari(t) : null);
      if (!ul) {
        const d = tgl(bersih(av.textContent));
        if (d) out.umum.push(d);
        return out;
      }
      Array.prototype.forEach.call(ul.children, (li) => {
        const sub = li.querySelector("ul");
        if (!sub) {
          const d = tgl(bersih(li.textContent));
          if (d) out.umum.push(d);
          return;
        }
        const g = [],
          tg = [];
        Array.prototype.forEach.call(sub.children, (x) => {
          const tx = bersih(x.textContent),
            d = adaGrup(tx) ? null : tgl(tx);
          if (adaGrup(tx)) g.push(tx);
          else if (d) tg.push(d);
        });
        const maks = tg.length ? Math.max.apply(null, tg) : 0;
        if (g.length)
          out.blok.push({
            g,
            t: maks,
          });
        else if (maks) out.umum.push(maks);
      });
      return out;
    }

    function estimasiAkses(x) {
      const av = x.av;
      if (!av)
        return {
          ok: true,
          ts: null,
        };
      const milik = av.blok.filter((b) => b.g.some(grupCocok)).map((b) => b.t);
      if (milik.length)
        return {
          ok: true,
          ts: Math.max.apply(null, milik) || null,
        };
      // Dibuang hanya jika SEMUA grup pembatasnya jelas milik kelas/shift lain
      const kenal =
        av.blok.length &&
        av.blok.every((b) =>
          b.g.every((g) => {
            const i = infoKelas(g);
            return i.kel.length || i.hur.length || i.shf.length;
          }),
        );
      if (kenal)
        return {
          ok: false,
          ts: null,
        };
      if (av.umum.length)
        return {
          ok: true,
          ts: Math.max.apply(null, av.umum),
        };
      return {
        ok: true,
        ts: null,
      };
    }

    function cocokMatkul(course, namaJadwal) {
      const kode = (String(course).match(/[A-Za-z]{2,}\d{2,}/) || [])[0];
      if (
        kode &&
        String(namaJadwal).toUpperCase().indexOf(kode.toUpperCase()) >= 0
      )
        return true;
      const depan = norm(String(course).split("/")[0]),
        j = norm(String(namaJadwal));
      return !!depan && !!j && (j.indexOf(depan) >= 0 || depan.indexOf(j) >= 0);
    }

    function pilihJadwal(x) {
      const jd = bacaJadwal(),
        prak = /praktikum/i.test(x.nama);
      let c = [];
      HARI.forEach((h, idx) =>
        (jd[h] || []).forEach((r) => {
          if (cocokMatkul(x.course, r.kode + " " + r.nama))
            c.push({
              d: idx,
              r,
            });
        }),
      );
      if (!c.length) return null;
      const pref = c.filter((z) => (z.r.tipe === "Praktikum") === prak);
      c = pref.length ? pref : c;
      return c.sort(
        (a, b) => ((a.d + 6) % 7) - ((b.d + 6) % 7) || a.r.s - b.r.s,
      )[0];
    }

    function mingguTs(x) {
      if (x.minggu === null || x.minggu === undefined) return null;
      const p = pilihJadwal(x);
      if (!p) return null;
      const n = new Date(),
        sen = new Date(n.getFullYear(), n.getMonth(), n.getDate());
      sen.setDate(sen.getDate() - ((sen.getDay() + 6) % 7));
      const buka = new Date(
        sen.getFullYear(),
        sen.getMonth(),
        sen.getDate() + x.minggu * 7 + ((p.d + 6) % 7),
      );
      return new Date(
        buka.getFullYear(),
        buka.getMonth(),
        buka.getDate() + 7,
        Math.floor(p.r.e / 60),
        p.r.e % 60,
        0,
      ).getTime();
    }

    function estimasi(x) {
      const e = estimasiAkses(x);
      if (!e.ok) return e;
      if (x.tsC)
        return {
          ok: true,
          ts: x.tsC,
          src: "course",
        }; // tenggat asli dari halaman course
      if (e.ts !== null) return e;
      const t = mingguTs(x);
      return t !== null
        ? {
            ok: true,
            ts: t,
            src: "minggu",
          }
        : e;
    }

    function semuaData() {
      const ids = {};
      cache.forEach((d) => {
        const m = String(d.url).match(/\/mod\/[^?#]*\?(?:[^#]*&)?id=(\d+)/);
        if (m) ids[m[1]] = 1;
      });
      const out = cache.slice(),
        skrg = Date.now();
      extra.forEach((x) => {
        if (x.cmid && ids[x.cmid]) return;
        if (kirim[x.id]) x.selesai = true; // terbukti sudah dikirim di Moodle
        const e = estimasi(x);
        if (!e.ok) return;
        let ts = e.ts,
          jenis =
            ts === null
              ? "nodate"
              : e.src === "course"
                ? "course"
                : "perkiraan";
        if (ts !== null && ts < skrg - (e.src === "course" ? 90 : 56) * 864e5)
          return;
        // Perkiraan yang sudah lewat dan tidak bisa dipastikan: jangan dicap "terlewat"
        if (jenis === "perkiraan" && ts < skrg && !x.adaC) {
          ts = null;
          jenis = "nodate";
        }
        x.tsAsli = ts;
        // Lewat tenggat tetapi belum terbukti belum dikerjakan: masuk "Perlu dicek", bukan "Terlewat"
        if (
          ts !== null &&
          ts < skrg &&
          !x.selesai &&
          !done[x.id] &&
          !belum[x.id] &&
          !x.adaC
        ) {
          ts = null;
          jenis = "cek";
        }
        x.ts = ts;
        x.jenis = jenis;
        out.push(x);
      });
      return out;
    }

    function pool(arr, n, fn) {
      let i = 0;
      const worker = () =>
        i >= arr.length
          ? Promise.resolve()
          : new Promise((res) => res(fn(arr[i++])))
              .catch(() => {})
              .then(worker);
      return Promise.all(
        Array.from(
          {
            length: Math.min(n, arr.length),
          },
          worker,
        ),
      );
    }

    const bagianNo = (sec) => {
      if (!sec) return null;
      let n = sec.getAttribute("data-number");
      if (n === null || n === "") {
        const m = (sec.id || "").match(/^section-(\d+)$/);

    // Cari bagian "minggu ini" bila course tidak menandai li.section.current
    function bagianMingguIni(doc) {
      const secs = Array.prototype.slice.call(
        doc.querySelectorAll("li.section"),
      );
      const now = new Date();
      now.setHours(12, 0, 0, 0);
      // 1) judul berisi rentang tanggal, misalnya "10 November - 16 November"
      for (const s of secs) {
        const hd = s.querySelector(
          ".sectionname, [data-for='section_title'], h3",
        );
        const m = bersih(hd ? hd.textContent : "").match(
          /(\d{1,2})\s+([A-Za-z]{3,})\s*[-–]\s*(\d{1,2})\s+([A-Za-z]{3,})/,
        );
        const b1 = m && BULAN[m[2].slice(0, 3).toLowerCase()],
          b2 = m && BULAN[m[4].slice(0, 3).toLowerCase()];
        if (!m || b1 === undefined || b2 === undefined) continue;
        const y = now.getFullYear();
        let a = new Date(y, b1, +m[1]),
          z = new Date(y, b2, +m[3], 23, 59);
        if (z < a) {
          if (now.getMonth() < 6) a = new Date(y - 1, b1, +m[1]);
          else z = new Date(y + 1, b2, +m[3], 23, 59);
        }
        if (now >= a && now <= z) return s;
      }
      // 2) hitung dari tanggal mulai semester (isi SEMESTER_MULAI di pengaturan)
      if (SEMESTER_MULAI) {
        const p = SEMESTER_MULAI.split("-"),
          st = new Date(+p[0], +p[1] - 1, +p[2]);
        const mg = Math.floor((now - st) / (7 * 864e5)) + 1;
        if (mg >= 1) return secs.find((s) => bagianNo(s) === mg) || null;
      }
      return null;
    }

    // Baca "Due/Batas waktu" yang tampil di halaman course
    function bacaTanggalAktivitas(a) {
      const el = a.querySelector(
        '[data-region="activity-dates"], .activity-dates',
      );
      const teks = bersih((el || a).textContent);
      const bagian = teks.split(
        /(?=\b(?:Opened|Opens|Due|Closes|Closed|Dibuka|Membuka|Ditutup|Menutup|Batas waktu|Batas pengumpulan|Batas akhir|Tenggat|Jatuh tempo|Berakhir)\s*:)/i,
      );
      let tutupTs = null;
      bagian.forEach((p) => {
        if (
          !/^\s*(due|closes?|closed|ditutup|menutup|batas waktu|batas pengumpulan|batas akhir|tenggat|jatuh tempo|berakhir)\s*:/i.test(
            p,
          )
        )
          return;
        const d = tglDari(p);
        if (d !== null) tutupTs = tutupTs === null ? d : Math.max(tutupTs, d);
      });
      return {
        tutup: tutupTs,
      };
    }

    function infoAktivitas(a) {

        (/modtype_(\w+)/.exec(cls) ||

      const tugas =
        TIPE_PASTI.indexOf(tipe) >= 0 ||
        (TIPE_STATIS.indexOf(tipe) < 0 && tg.tutup !== null);
      return {
        tipe,
        ln,
        tg,

    function parseTugas(doc, nmC, curNo) {
      const out = [];
      Array.prototype.forEach.call(
        doc.querySelectorAll("li.activity, [data-for='cmitem']"),
        (a) => {
          const inf = infoAktivitas(a);
          if (!inf.tugas || !inf.ln) return;
          const nama = namaLink(inf.ln);
          if (!nama) return;
          const url = new URL(
              inf.ln.getAttribute("href"),
              basis() + "/course/view.php",
            ).href,
            m = url.match(/id=(\d+)/);
          const comp = a.querySelector('[data-region="completion-info"]'),
            b = comp && comp.querySelector("button, .btn");
          const selesai =
            !!comp &&
            (/^(done|selesai|completed)/i.test(
              bersih((b || comp).textContent),
            ) ||
              !!(b && /btn-success/.test(b.className)));
          const noS = bagianNo(a.closest("li.section"));
          out.push({
            id: idStabil(url, nama),
            ts: null,
            nama,
            url,
            course: nmC,
            desc: "",
            aksi: null,
            teks: nama + " " + nmC,
            cmid: m ? m[1] : "",
            selesai,
            adaC: !!comp,
            tsC: inf.tg.tutup,
            av: bacaAkses(
              a.querySelector(
                ".availabilityinfo, [data-region='availabilityinfo']",
              ),
            ),
            minggu:
              curNo !== null && noS !== null && noS > 0 ? noS - curNo : null,
            jenis: "nodate",
          });
        },
      );
      return out;
    }

    function bacaCourse(c) {
      const urai = (h) => new DOMParser().parseFromString(h, "text/html");
      return ambilHtml(basis() + "/course/view.php?id=" + c.id).then((html) => {
        const doc = urai(html),
          h1 = doc.querySelector("h1"),
          nmC = c.nama || (h1 ? bersih(h1.textContent) : "");
        let cur = doc.querySelector("li.section.current");
        if (!cur)
          cur = Array.prototype.find.call(
            doc.querySelectorAll("li.section"),
            (sc) => {
              const hd = sc.querySelector(
                ".course-section-header, .section-header, .sectionhead, h3",
              );
              return (
                hd &&
                /current (week|topic)|minggu ini|pekan ini/i.test(
                  hd.textContent,
                )
              );
            },
          );
        if (!cur) cur = bagianMingguIni(doc);
        const curNo = bagianNo(cur),
          materi = {
            course: nmC,
            judul: "",
            items: [],
          };
        if (cur) {
          const hd = cur.querySelector(
            ".sectionname, [data-for='section_title'], h3",
          );
          materi.judul = hd ? bersih(hd.textContent) : "";
          Array.prototype.forEach.call(
            cur.querySelectorAll("li.activity"),
            (a) => {
              const inf = infoAktivitas(a);
              if (!inf.ln || !inf.tipe || inf.tugas) return;
              const nama = namaLink(inf.ln);
              if (nama)
                materi.items.push({
                  nama,
                  url: inf.ln.href,
                  ic: IKON_MATERI[inf.tipe] || "journal-text",
                });
            },
          );
        }
        const tugas = parseTugas(doc, nmC, curNo);

        // Course "satu bagian per halaman": baca bagian lain yang tidak ada di halaman utama (3 sekaligus)
        const ada = {},
          links = {};
        Array.prototype.forEach.call(
          doc.querySelectorAll("li.section"),
          (s) => {
            const n = bagianNo(s);
            if (n !== null) ada[n] = 1;
          },
        );
        Array.prototype.forEach.call(
          doc.querySelectorAll('a[href*="section"]'),
          (a) => {
            try {
              const u = new URL(
                  a.getAttribute("href"),
                  basis() + "/course/view.php",
                ),
                s = u.searchParams.get("section");
              if (
                !/\/course\/view\.php$/.test(u.pathname) ||
                u.searchParams.get("id") !== String(c.id)
              )
                return;
              if (!s || !/^\d+$/.test(s) || ada[+s]) return;
              links[s] = u.href;
            } catch (e) {}
          },
        );
        const hasil = [];
        return pool(Object.keys(links).slice(0, 25), 3, (k) =>
          sesiHabis
            ? null
            : ambilHtml(links[k]).then((h) => {
                hasil.push(h);
              }),
        ).then(() => {
          const seen = {};
          tugas.forEach((t) => {
            seen[t.id] = 1;
          });
          hasil.forEach((h) =>
            parseTugas(urai(h), nmC, curNo).forEach((t) => {
              if (!seen[t.id]) {
                seen[t.id] = 1;
                tugas.push(t);
              }
            }),
          );
          return {
            tugas,
            materi,
          };
        });
      });
    }
