    // ----- Status pengiriman: tugas/kuis yang sudah dikerjakan tidak dihitung terlewat -----
    let sedangCek = false;
    const simpanStatus = () => {
      store.set("fk_kirim", JSON.stringify(kirim));

    // true = sudah dikirim/selesai, false = pasti belum, null = tidak bisa dipastikan
    function statusKirim(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const comp = doc.querySelector('[data-region="completion-info"]'),
        cb = comp && comp.querySelector("button, .btn");
      if (
        comp &&
        /^(done|selesai|completed)/i.test(bersih((cb || comp).textContent))
      )
        return true;
      // Tugas (assign): kelas CSS Moodle tidak bergantung bahasa
      if (doc.querySelector(".submissionstatussubmitted, .submissiongraded"))
        return true;
      const tbl = doc.querySelector(
        ".submissionstatustable, .submissionsummarytable",
      );
      if (tbl) {
        const POS =
            /submitted|dikirim|terkirim|diserahkan|dikumpul|graded|dinilai/i,
          NEG = /not submitted|no submission|no attempt|draft|belum|tidak ada/i;
        let st = "",
          gr = "";
        Array.prototype.forEach.call(tbl.querySelectorAll("tr"), (tr) => {
          const th = tr.querySelector("th"),
            td = tr.querySelector("td");
          if (!th || !td) return;
          const h = th.textContent;
          if (
            /submission status|status (pengiriman|penyerahan|pengumpulan|pengerjaan)/i.test(
              h,
            )
          )
            st = bersih(td.textContent);
          else if (/grading status|status penilaian/i.test(h))
            gr = bersih(td.textContent);
        });
        if (st && POS.test(st) && !NEG.test(st)) return true;
        if (/^(graded|dinilai)$/i.test(gr)) return true;
        return false;
      }
      // Kuis
      const qa = doc.querySelector("table.quizattemptsummary");
      if (qa)
        return (
          /\b(finished|selesai)\b/i.test(qa.textContent) ||
          !!qa.querySelector('a[href*="review.php"]')
        );
      if (doc.querySelector('a[href*="review.php?attempt"]')) return true;
      if (
        doc.querySelector(
          '.quizstartbuttondiv, form[action*="startattempt.php"], form[action*="attempt.php"]',
        )
      )
        return false;
      return null;
    }

    // Memeriksa tugas dari Timeline/kalender DAN dari halaman course (kuis selesai ikut terbaca)
    function periksaKirim() {
      if (sedangCek || sesiHabis) return;
      const skrg = Date.now(),
        segar = (x) => {
          const t = belum[x.id] || tdk[x.id];
          return !!t && skrg - t < 120 * 6e4;
        };
      const q = lastSemua.filter(
        (x) =>
          !x.selesai &&
          !kirim[x.id] &&
          !done[x.id] &&
          /\/mod\/(assign|quiz)\//.test(x.url) &&
          milikku(x) &&
          !segar(x),
      );
      if (!q.length) return;
      // Yang sudah lewat tenggat diperiksa lebih dulu
      const tgt = (x) => x.tsC || x.ts || 0;
      const lewat = (x) => (tgt(x) && tgt(x) < skrg ? 0 : 1);
      q.sort((a, b) => lewat(a) - lewat(b) || tgt(b) - tgt(a));
      sedangCek = true;
      pool(q, 3, (x) =>
        sesiHabis
          ? null
          : ambilHtml(x.url).then((h) => {
              const s = statusKirim(h),
                n = Date.now();
              delete belum[x.id];
              delete tdk[x.id];
              if (s === true) kirim[x.id] = n;
              else if (s === false) belum[x.id] = n;
              else tdk[x.id] = n;
              simpanStatus();
              renderTunda();
            }),
      ).then(() => {
        sedangCek = false;
        render();
      });
    }

    // ----- Muat data course: tampilkan data tersimpan dulu, perbarui di latar belakang -----
    let extraBy = {},
      urutC = [],
      segarId = 0;
    const PESAN_SEGAR = "Memperbarui data di latar belakang...";

    function susunExtra() {
      extra = [];
      daftarMateri = [];
      Object.keys(extraBy)
        .sort((a, b) => urutC.indexOf(a) - urutC.indexOf(b))
        .forEach((k) => {
          const d = extraBy[k];
          extra = extra.concat(d.tugas);
          if (d.materi && d.materi.items && d.materi.items.length)
            daftarMateri.push(d.materi);
        });
    }

    function muatExtra(paksa) {
      const id = ++segarId;
      extraGagal = 0;
      sesiHabis = false;
      if (!extra.length) {
        extraStatus = "loading";
        render();
      }
      daftarCourse()
        .then((cs) => {
          if (id !== segarId) return;
          urutC = cs.map((c) => String(c.id));
          const urus = [],
            skrg = Date.now();
          cs.forEach((c) => {
            const o = bacaCacheCourse(c);
            if (o) extraBy[c.id] = o.d;
            if (!o || paksa || skrg - o.t > CACHE_MENIT * 6e4) urus.push(c);
          });
          Object.keys(extraBy).forEach((k) => {
            if (urutC.indexOf(k) < 0) delete extraBy[k];
          });
          susunExtra();
          extraStatus = urus.length
            ? extra.length
              ? "refresh"
              : "loading"
            : "done";
          render();
          if (!urus.length) {
            periksaKirim();
            return;
          }
          stat(PESAN_SEGAR);
          return pool(urus, 3, (c) =>
            sesiHabis || id !== segarId
              ? null
              : bacaCourse(c).then(
                  (d) => {
                    simpanCacheCourse(c, d);
                    extraBy[c.id] = d;
                    susunExtra();
                    renderTunda();
                  },
                  () => {
                    if (!extraBy[c.id]) extraGagal++;
                  },
                ),
          ).then(() => {
            if (id !== segarId) return;
            extraStatus = extraGagal || sesiHabis ? "error" : "done";
            if (statEl.textContent === PESAN_SEGAR) stat("");
            susunExtra();
            render();
            periksaKirim();
          });
        })
        .catch(() => {
          extraStatus = "error";
          extraGagal = extra.length ? 0 : 1;
          if (statEl.textContent === PESAN_SEGAR) stat("");
          render();
        });
    }

    // ===== MUAT DATA TIMELINE =====
    let tmr,
      pantau = null,
      coba = 0,
      kalenderOk = false;

    // Timeline Moodle memuat sedikit event dulu; tekan "Show more" otomatis sampai habis
    // (hanya dipakai sebagai cadangan jika API kalender gagal)
    let moreKlik = 0;

    function mintaLagi() {
      const b = blokNative(),
        btn = b && b.querySelector('[data-action="more-events"]');
      if (!btn || btn.disabled || moreKlik >= 40) return;
      const w = btn.closest('[data-region="more-events-button-container"]');
      if (
        (w && /\b(hidden|d-none)\b/.test(w.className)) ||
        /\b(hidden|d-none)\b/.test(btn.className)
      )
        return;
      moreKlik++;
      btn.click();
    }

    function muatUlang() {
      if (kalenderOk) return; // sumber utama sudah API kalender
      const d = unikId(bacaData());
      if (d.length && !cache.length)
        animNext.tugas = animNext.materi = animNext.grafik = true;
      if (d.length || !cache.length) cache = d;
      render();
      cekNotif();
      setTimeout(periksaKirim, 800);
      mintaLagi();
    }

    function tunggu() {
      const b = blokNative();
      if (b && b.querySelector('[data-region="event-list-item"]')) {
        muatUlang();
        if (!pantau) {
          pantau = new MutationObserver(() => {
            clearTimeout(tmr);
            tmr = setTimeout(muatUlang, 400);
          });
          pantau.observe(b, {
            childList: true,
            subtree: true,
          });
        }
        return;
      }
      if (++coba < 30) setTimeout(tunggu, 500);
      else {
        cache = [];
        timelineGagal = !blokNative();
        render();
      }
    }

    // ----- Sumber utama: API kalender Moodle (semua tugas dalam 1-2 permintaan, bukan scraping) -----
    function ambilKalender() {
      if (!hasM()) return Promise.reject("no M");
      const skrg = Math.floor(Date.now() / 1000),
        hasil = [];
      const halaman = (after) =>
        ajaxMoodle([
          {
            index: 0,
            methodname: "core_calendar_get_action_events_by_timesort",
            args: Object.assign(
              {
                timesortfrom: skrg - 120 * 86400,
                timesortto: skrg + 365 * 86400,
                limitnum: 50,
                limittononsuspendedevents: true,
              },
              after
                ? {
                    aftereventid: after,
                  }
                : {},
            ),
          },
        ]).then((j) => {
          const r = j && j[0];
          if (!r || r.error) throw new Error("kalender");
          const ev = (r.data && r.data.events) || [];
          ev.forEach((e) => hasil.push(e));
          return ev.length >= 50 && hasil.length < 600
            ? halaman(r.data.lastid || ev[ev.length - 1].id)
            : hasil;
        });
      return halaman(0);
    }

    function jadiTugas(e) {
      const url = e.url || e.viewurl || "#",
        nama = bersih(e.activityname || e.name),
        course = e.course ? bersih(e.course.fullname) : "";
      return {
        id: idStabil(url, nama),
        ts: (e.timesort || e.timestart) * 1000,
        nama,
        url,
        course,
        desc: e.activitystr || "",
        aksi:
          e.action && e.action.actionable
            ? {
                name: e.action.name,
                url: e.action.url,
              }
            : null,
        teks: nama + " " + course,
      };
    }

    function muatKalender() {
      ambilKalender()
        .then((ev) => {
          const d = unikId(ev.map(jadiTugas).filter((x) => x.nama));
          if (d.length && !cache.length)
            animNext.tugas = animNext.materi = animNext.grafik = true;
          cache = d;
          kalenderOk = true;
          timelineGagal = false;
          render();
          cekNotif();
          setTimeout(periksaKirim, 800);
        })
        .catch(() => {
          if (!kalenderOk) {
            // cadangan: baca blok Timeline di halaman seperti sebelumnya
            coba = 0;
            tunggu();
          }
        });
    }
    setInterval(() => {
      if (!document.hidden) muatKalender();
    }, 5 * 60000);

    function ulangi() {
      coba = 0;
      moreKlik = 0;
      timelineGagal = false;
      Object.keys(belum).forEach((k) => delete belum[k]);
      Object.keys(tdk).forEach((k) => delete tdk[k]);
      simpanStatus();
      muatKalender();
      muatExtra(true);
    }

    // ===== EVENT =====
    let tq;
    inQ.addEventListener("input", () => {
      intipCari();
      clearTimeout(tq);
      tq = setTimeout(render, 200);
    });
    [
      [selK, "fk_kelas"],
      [selS, "fk_shift"],
    ].forEach((p) =>
      p[0].addEventListener("change", () => {
        store.set(p[1], p[0].value);
        render();
      }),
    );
    all.addEventListener("change", () => {
      store.set("fk_all", all.checked ? "1" : "0");
      render();
    });
    btnN.addEventListener("click", () => {
      try {
        const sel = () => {
            updateNotifBtn();
            cekNotif();
          },
          r = Notification.requestPermission(sel);
        if (r && r.then) r.then(sel);
      } catch (e) {}
    });
    $("fk-copy").addEventListener("click", function () {
      const t = bangunTeks();
      if (!t) return kedip(this, ic("info-circle") + " Tidak ada tugas");
      salin(t, (ok) =>
        kedip(
          this,
          ok ? ic("check2") + " Tersalin" : ic("x-circle") + " Gagal",
        ),
      );
    });
    $("fk-wa").addEventListener("click", function () {
      const t = bangunTeks();
      if (!t) return kedip(this, ic("info-circle") + " Tidak ada tugas");
      window.open(WA + "?text=" + encodeURIComponent(t), "_blank", "noopener");
    });

    panel.addEventListener("change", (e) => {
      const t = e.target;
      if (!t.classList || !t.classList.contains("fk-chk") || t.disabled) return;
      const id = t.dataset.id,
        rc = t.getBoundingClientRect(),
        item = lastSemua.find((x) => x.id === id);
      const info = t.checked ? siapTerbang(t) : null;
      if (t.checked) {
        const n = Date.now();
        done[id] = n;
        delete proses[id];
        justDone = id;
        rek[id] = [n, !item || item.ts === null || n <= item.ts ? 1 : 0];
      } else {
        delete done[id];
        delete rek[id];
        justDone = null;
      }
      store.set("fk_done", JSON.stringify(done));
      store.set("fk_proses", JSON.stringify(proses));
      store.set("fk_rek", JSON.stringify(rek));
      animNext.grafik = true;
      render();
      if (info) mulaiTerbang(info);
      if (t.checked) reaksiSelesai(item, rc);
      else
        sementara(
          "Dibuka lagi ya? Tidak apa-apa, pelan-pelan saja.",
          "neutral",
          5000,
        );
    });

    panel.addEventListener("click", (e) => {
      const tg = e.target;
      if (!tg.closest) return;
      const at = (sel) => tg.closest(sel);
      let el;
      // Klik kartu jadwal = buka course (kecuali yang diklik tautan/tombol di dalamnya)
      if ((el = at("[data-href]")) && !at("a, button, input")) {
        location.href = el.dataset.href;
        return;
      }
      if (at("#fk-mascot-btn")) {
        if (skipClick) return;
        return ketukMaskot();
      }
      if (at("#fk-gmin")) {
        gMin = true;
        store.set("fk_gmin", "1");
        return setMood(gMood);
      }
      if ((el = at(".fk-jsum"))) {
        jdOpen = jdOpen === el.dataset.day ? "" : el.dataset.day;
        renderJadwal();
        if (jdOpen) efekMasuk($("fk-jadwal"));
        return;
      }
      if ((el = at(".fk-tab"))) return gantiTab(el.dataset.tab);
      if ((el = at("[data-goto]"))) return gantiTab(el.dataset.goto);
      if ((el = at("[data-start]"))) {
        const id = el.dataset.start,
          item = lastSemua.find((x) => x.id === id);
        if (proses[id]) delete proses[id];
        else proses[id] = Date.now();
        store.set("fk_proses", JSON.stringify(proses));
        animNext.grafik = true;
        render();
        return sementara(
          proses[id]
            ? `Semangat mengerjakan "${item ? item.nama : "tugas itu"}"!`
            : "Oke, dikembalikan ke belum dikerjakan.",
          proses[id] ? "happy" : "neutral",
          5000,
        );
      }
      if ((el = at("[data-grup]"))) {
        tutup[el.dataset.grup] = tutup[el.dataset.grup] ? 0 : 1;
        store.set("fk_tutup", JSON.stringify(tutup));
        return render();
      }
      if (at("[data-retry]")) return ulangi();
      if ((el = at("[data-fokus]"))) return aksiFokus(el.dataset.fokus);
      if (at("[data-iseng]")) {
        isengOn = !isengOn;
        store.set("fk_iseng", isengOn ? "1" : "0");
        terapkanTema();
        return sementara(
          isengOn ? "Aku boleh iseng lagi? Asyik!" : "Oke, aku diam saja.",
          isengOn ? "happy" : "neutral",
          3500,
        );
      }
      if (at("#fk-set")) {
        $("fk-settings").hidden = !$("fk-settings").hidden;
        return;
      }
      if (at("#fk-top"))
        return panel.scrollIntoView({
          behavior: REDUCE ? "auto" : "smooth",
          block: "start",
        });
      if ((el = at("[data-tema]"))) {
        tema = el.dataset.tema;
        store.set("fk_tema", tema);
        terapkanTema();
        return sementara("Warna tema diganti. Cantik!", "happy", 4000);
      }
      if ((el = at("[data-aks]"))) {
        aks = el.dataset.aks;
        store.set("fk_ac", aks);
        terapkanTema();
        terapkanOutfit();
        posisiPerch();
        anim(mBtn, "fk-wig", 500);
        return sementara(
          aks === "polos" ? "Kembali polos, deh." : "Aksesori baru, aku suka!",
          "happy",
          4000,
        );
      }
      if ((el = at("[data-mode]"))) {
        if (el.dataset.mode === chartMode) return;
        chartMode = el.dataset.mode;
        store.set("fk_chart", chartMode);
        animNext.grafik = true;
        render();
        return sementara(
          chartMode === "donut"
            ? "Grafik lingkar: lihat porsi tugas selesai."
            : "Grafik batang: bandingkan progres tiap matkul.",
          "happy",
          5000,
        );
      }
      if (at("#fk-toggledone")) {
        showDone = !showDone;
        store.set("fk_showdone", showDone ? "1" : "0");
        render();
      }
      if (at("#fk-togglenodate")) {
        showNodate = !showNodate;
        store.set("fk_shownodate2", showNodate ? "1" : "0");
        render();
      }
      if (at("#fk-togglecek")) {
        showCek = !showCek;
        store.set("fk_showcek", showCek ? "1" : "0");
        render();
      }
    });

    // ===== MULAI =====
    if (
      store.get("fk_kelas", null) === null &&
      store.get("fk_autotry", "0") !== "1"
    ) {
      store.set("fk_autotry", "1");
      setTimeout(jalankanDeteksi, 1200);
    }
    bersihkanCache();
    updateNotifBtn();
    setMood("neutral");
    terapkanTema();
    let scT = 0;
    document.addEventListener(
      "scroll",
      () => {
        if (scT) return;
        scT = requestAnimationFrame(() => {
          scT = 0;
          const r = panel.getBoundingClientRect();
          $("fk-top").hidden = !(r.top < -200 && r.bottom > 120);
        });
      },
      {
        capture: true,
        passive: true,
      },
    );
    if (window.ResizeObserver) new ResizeObserver(cekLebar).observe(panel);
    window.addEventListener("resize", cekLebar);
    panel.dataset.w = panel.clientWidth < LEBAR_SEMPIT ? "s" : "m";
    applyTab();
    muatKalender();
    render();
    sementara(
      `Halo! Aku ${NAMA_MASKOT}, pemandu tugasmu. Ketuk aku kalau butuh saran.`,
      "happy",
      5000,
    );
    setTimeout(muatExtra, 1500);
    setInterval(() => {
      if (document.hidden) return;
      render();
      cekNotif();
    }, 60000);
    [0, 800, 2000, 4000].forEach((ms) => setTimeout(aturNative, ms));
  })();
</script>
