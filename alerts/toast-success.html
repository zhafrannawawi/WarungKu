<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Alert | Toast Sukses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../assets/image/logo.ico">
    <style>
        body.alert-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
    </style>
</head>

<body class="alert-standalone-canvas">
    <div class="alert alert-success alert-dismissible fade show shadow-sm d-flex align-items-center py-3 px-3 mb-0" role="alert" style="min-width: 280px; max-width: 90vw;">
        <div class="fw-semibold small flex-grow-1">Produk baru berhasil ditambahkan!</div>
        <button type="button" class="btn-close position-static ms-3 p-1" style="font-size: .65rem;" aria-label="Tutup"></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
