<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Modal | Konfirmasi Keluar (Owner)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/image/logo.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.modal-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .modal-standalone-wrap {
            width: 100%;
        }
        .modal-standalone-wrap .modal {
            position: static;
            display: block;
            overflow: visible;
        }
        .modal-standalone-wrap .modal-dialog {
            margin: 0 auto;
            transform: none !important;
        }
    </style>
</head>

<body class="modal-standalone-canvas">
    <div class="modal-standalone-wrap">
        <div class="modal show" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 410px;">
        <div class="modal-content border-0 shadow rounded-4 overflow-hidden position-relative">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3 z-3" aria-label="Tutup"></button>
            <div class="modal-body p-4 text-center">
                <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger" style="width: 58px; height: 58px; border: 4px solid #fef2f2;">
                    <i data-lucide="log-out" style="width: 24px; height: 24px;"></i>
                </div>
                <h5 class="fw-bold text-dark mb-1">Konfirmasi Keluar</h5>
                <p class="text-secondary small mb-3">
                    Apakah Anda yakin ingin keluar? Sesi kerja aktif di aplikasi <strong class="text-dark">WarungKu</strong> akan diakhiri.
                </p>
                <div class="p-3 bg-light border rounded-3 text-start d-flex align-items-center justify-content-between mb-3">
                    <div class="d-flex align-items-center gap-2 overflow-hidden me-2">
                        <div class="sidebar-user-avatar" style="width: 38px; height: 38px;">
                            <i data-lucide="user" class="icon-sm"></i>
                        </div>
                        <div class="overflow-hidden">
                            <div class="fw-semibold text-dark text-truncate" style="font-size: 0.875rem;">Budi</div>
                            <small class="text-muted d-block text-truncate" style="font-size: 0.75rem;">Owner</small>
                        </div>
                    </div>
                </div>
                <div class="py-2 px-3 bg-warning-subtle text-dark border border-warning-subtle rounded-3 d-flex align-items-center gap-2 text-start mb-0">
                    <i data-lucide="alert-triangle" class="text-warning flex-shrink-0" style="width: 18px; height: 18px;"></i>
                    <span style="font-size: 0.8125rem; line-height: 1.35;">Pastikan seluruh transaksi kasir yang sedang berjalan telah selesai dicatat.</span>
                </div>
            </div>
            <div class="modal-footer border-0 bg-white px-4 pb-4 pt-0 d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-light border text-secondary flex-fill py-2 rounded-3 fw-medium" style="font-size: 0.875rem;">Batal</button>
                <a href="../../auth/login.html" class="btn btn-danger flex-fill py-2 rounded-3 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 shadow-sm text-decoration-none" style="font-size: 0.875rem;">
                    <i data-lucide="log-out" style="width: 16px; height: 16px;"></i>
                    <span>Ya, Keluar</span>
                </a>
            </div>
        </div>
    </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
