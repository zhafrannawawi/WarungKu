<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Modal | Pengaturan Akun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/image/logo.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.modal-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .modal-standalone-wrap {
            width: 100%;
        }
        .modal-standalone-wrap .modal {
            position: static;
            display: block;
            overflow: visible;
        }
        .modal-standalone-wrap .modal-dialog {
            margin: 0 auto;
            transform: none !important;
        }
    </style>
</head>

<body class="modal-standalone-canvas">
    <div class="modal-standalone-wrap">
        <div class="modal show" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <form class="modal-content border-0 shadow-sm rounded-4 overflow-hidden" onsubmit="return false;">
            <div class="modal-header border-bottom px-4 py-3 bg-white">
                <div class="d-flex align-items-center gap-2">
                    <div class="p-2 bg-primary-subtle text-primary rounded-3">
                        <i data-lucide="user-cog" class="icon-sm"></i>
                    </div>
                    <div>
                        <h6 class="modal-title fw-bold text-dark mb-0">Pengaturan Akun</h6>
                        <small class="text-muted" style="font-size: 0.75rem;">Perbarui profil pengguna &amp; kata sandi</small>
                    </div>
                </div>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted mb-1">Nama Lengkap <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" value="Budi Santoso" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" value="Budi" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-muted mb-1">No. Telepon / WA</label>
                        <input type="text" class="form-control" value="081234567890">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted mb-1">Email</label>
                    <input type="email" class="form-control" value="budi.santoso@warungberkah.id">
                </div>
                <hr class="my-3 text-muted">
                <small class="text-muted d-block mb-2" style="font-size: 0.75rem;">Kosongkan bagian di bawah jika tidak ingin mengganti password.</small>
                <div class="row g-2">
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Password Saat Ini</label>
                        <div class="position-relative">
                            <input type="password" class="form-control pe-5" placeholder="Password lama">
                            <button type="button" class="btn-toggle-pass" title="Tampilkan/Sembunyikan Password" onclick="togglePasswordVisibility(this.previousElementSibling, this)">
                                <i data-lucide="eye" class="icon-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-6">
                        <label class="form-label small fw-semibold text-muted mb-1">Password Baru</label>
                        <div class="position-relative">
                            <input type="password" class="form-control pe-5" minlength="6" placeholder="Min. 6 karakter">
                            <button type="button" class="btn-toggle-pass" title="Tampilkan/Sembunyikan Password" onclick="togglePasswordVisibility(this.previousElementSibling, this)">
                                <i data-lucide="eye" class="icon-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-top bg-light px-4 py-3 d-flex justify-content-between">
                <button type="button" class="btn btn-sm btn-outline-secondary px-3 py-2 rounded-2 fw-medium">Batal</button>
                <button type="submit" class="btn btn-sm btn-primary px-4 py-2 rounded-2 fw-semibold d-inline-flex align-items-center gap-2 shadow-sm">
                    <i data-lucide="check" class="icon-sm"></i>
                    <span>Simpan Akun</span>
                </button>
            </div>
        </form>
    </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/main.js"></script>
</body>

</html>
