<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Modal | Tambah Akun Kasir Baru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/image/logo.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.modal-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .modal-standalone-wrap {
            width: 100%;
        }
        .modal-standalone-wrap .modal {
            position: static;
            display: block;
            overflow: visible;
        }
        .modal-standalone-wrap .modal-dialog {
            margin: 0 auto;
            transform: none !important;
        }
    </style>
</head>

<body class="modal-standalone-canvas">
    <div class="modal-standalone-wrap">
        <div class="modal show" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content border-0 shadow rounded-4 overflow-hidden" onsubmit="return false;">
            <div class="modal-header border-0 px-4 pt-4 pb-3 bg-white align-items-start">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-3 shadow-sm d-inline-flex align-items-center justify-content-center flex-shrink-0" style="width: 40px; height: 40px;">
                        <i data-lucide="user-plus" class="icon-sm"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-dark mb-1">Tambah Akun Kasir Baru</h5>
                        <p class="text-secondary mb-0 small">Buat kredensial login untuk staf kasir</p>
                    </div>
                </div>
                <button type="button" class="btn-close mt-1" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4 pt-2 pb-4">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-1">Nama Lengkap <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-secondary ps-3"><i data-lucide="user" width="16" height="16"></i></span>
                        <input type="text" class="form-control bg-light border-0 py-2"  placeholder="Contoh: Siti Aminah" required>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-semibold text-secondary mb-1">Username <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-secondary ps-3"><i data-lucide="at-sign" width="16" height="16"></i></span>
                            <input type="text" class="form-control bg-light border-0 py-2"  placeholder="sitikasir" required>
                        </div>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-semibold text-secondary mb-1">No. WhatsApp / HP <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-secondary ps-3"><i data-lucide="phone" width="16" height="16"></i></span>
                            <input type="tel" class="form-control bg-light border-0 py-2"  placeholder="0812-xxxx-xxxx">
                        </div>
                    </div>
                </div>
                <div class="mb-0">
                    <label class="form-label small fw-semibold text-secondary mb-1">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-0 text-secondary ps-3"><i data-lucide="mail" width="16" height="16"></i></span>
                        <input type="email" class="form-control bg-light border-0 py-2"  placeholder="siti@gmail.com">
                    </div>
                    <small class="text-secondary d-block mt-2" style="font-size: 0.75rem;">Username dipakai kasir untuk login ke shift kasir.</small>
                </div>
            </div>
            <div class="modal-footer border-top bg-light px-4 py-3 d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary rounded-3 px-3 py-2 fw-medium">Batal</button>
                <button type="submit" class="btn btn-primary rounded-3 shadow-sm d-inline-flex align-items-center gap-2 px-3 py-2 fw-semibold">
                    <span class="bg-white bg-opacity-25 rounded-2 d-inline-flex align-items-center justify-content-center" style="width: 28px; height: 28px;">
                        <i data-lucide="check" class="icon-xs"></i>
                    </span>
                    <span>Simpan Akun</span>
                </button>
            </div>
        </form>
    </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
