<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Modal | Catat Barang Masuk (Restock)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/image/logo.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.modal-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .modal-standalone-wrap {
            width: 100%;
        }
        .modal-standalone-wrap .modal {
            position: static;
            display: block;
            overflow: visible;
        }
        .modal-standalone-wrap .modal-dialog {
            margin: 0 auto;
            transform: none !important;
        }
    </style>
</head>

<body class="modal-standalone-canvas">
    <div class="modal-standalone-wrap">
        <div class="modal show" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content border-0 shadow rounded-4 overflow-hidden" onsubmit="return false;">
            <div class="modal-header border-bottom px-4 py-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-3 d-inline-flex align-items-center justify-content-center flex-shrink-0" style="width: 40px; height: 40px;">
                        <i data-lucide="package-plus" width="20" height="20"></i>
                    </div>
                    <div>
                        <h6 class="modal-title fw-bold text-dark mb-0">Catat Barang Masuk (Restock)</h6>
                        <small class="text-secondary">Tambah stok dan perbarui harga beli produk</small>
                    </div>
                </div>
                <button type="button" class="btn-close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Pilih Produk <span class="text-danger">*</span></label>
                    <select class="form-select rounded-3 py-2" required>
                        <option value="PRD-001">Beras Ramos 5kg (Stok saat ini: 4 sak)</option>
                        <option value="PRD-002">Minyak Goreng 1L (Stok saat ini: 28 pouch)</option>
                        <option value="PRD-003">Gula Pasir 1kg (Stok saat ini: 22 kg)</option>
                        <option value="PRD-004">Telur Ayam 1kg (Stok saat ini: 3 kg)</option>
                        <option value="PRD-005">Air Mineral 600ml (Stok saat ini: 48 botol)</option>
                        <option value="PRD-006">Teh Botol 350ml (Stok saat ini: 36 botol)</option>
                        <option value="PRD-007">Kopi Sachet Renteng (Stok saat ini: 60 pcs)</option>
                        <option value="PRD-008">Mie Instan Goreng (Stok saat ini: 55 bks)</option>
                        <option value="PRD-009">Keripik Singkong (Stok saat ini: 2 bks)</option>
                        <option value="PRD-010">Sabun Cuci Piring (Stok saat ini: 18 pouch)</option>
                        <option value="PRD-011">Deterjen Bubuk 800g (Stok saat ini: 0 bks)</option>
                        <option value="PRD-012">Kecap Manis 275ml (Stok saat ini: 16 botol)</option>
                    </select>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-semibold text-secondary">Jumlah Masuk <span class="text-danger">*</span></label>
                        <input type="number" class="form-control rounded-3 py-2" min="1" placeholder="0" required>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-semibold text-secondary">Harga Beli Satuan <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-secondary fw-semibold rounded-start-3">Rp</span>
                            <input type="number" class="form-control rounded-end-3 py-2" placeholder="0" required>
                        </div>
                    </div>
                </div>
                <div class="mb-0">
                    <label class="form-label small fw-semibold text-secondary">
                        Catatan <span class="text-secondary fw-normal">(Supplier / Keterangan, opsional)</span>
                    </label>
                    <textarea class="form-control rounded-3" rows="2" placeholder="Contoh: Kulakan dari Agen Sembako Makmur"></textarea>
                </div>
            </div>
            <div class="modal-footer border-top bg-light px-4 py-3 gap-2">
                <button type="button" class="btn bg-white border text-secondary rounded-3 px-3 py-2 fw-semibold">Batal</button>
                <button type="submit" class="btn btn-primary rounded-3 shadow-sm d-inline-flex align-items-center gap-2 px-3 py-2 fw-semibold">
                    <i data-lucide="check" width="16" height="16"></i>
                    <span>Simpan Restock</span>
                </button>
            </div>
        </form>
    </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
