<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Modal | Tambah Produk Baru</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/image/logo.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.modal-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .modal-standalone-wrap {
            width: 100%;
        }
        .modal-standalone-wrap .modal {
            position: static;
            display: block;
            overflow: visible;
        }
        .modal-standalone-wrap .modal-dialog {
            margin: 0 auto;
            transform: none !important;
        }
    </style>
</head>

<body class="modal-standalone-canvas">
    <div class="modal-standalone-wrap">
        <div class="modal show" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <form class="modal-content border-0 shadow rounded-4 overflow-hidden" onsubmit="return false;">
            <div class="modal-header border-bottom px-4 py-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-3 shadow-sm d-inline-flex align-items-center justify-content-center flex-shrink-0" style="width: 40px; height: 40px;">
                        <i data-lucide="package" class="icon-sm"></i>
                    </div>
                    <div>
                        <h5 class="modal-title fw-bold text-dark mb-0">Tambah Produk Baru</h5>
                        <p class="text-secondary mb-0 small">Lengkapi informasi data barang</p>
                    </div>
                </div>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4" style="background-color: #f8f9fa;">
                <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-3">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-3 p-2 d-inline-flex"><i data-lucide="tag" width="16" height="16"></i></div>
                        <span class="fw-bold text-dark">Informasi Produk</span>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary fw-medium mb-1">Nama Produk <span class="text-danger">*</span></label>
                        <input type="text" class="form-control rounded-3 px-3 py-2"  placeholder="Contoh: Beras Ramos Setra 5kg" required>
                    </div>
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small text-secondary fw-medium mb-1">Kategori <span class="text-danger">*</span></label>
                            <select class="form-select rounded-3 px-3 py-2" required>
                                <option value="CAT-001">Sembako</option>
                                <option value="CAT-002">Minuman</option>
                                <option value="CAT-003">Makanan Ringan</option>
                                <option value="CAT-004">Kebutuhan Rumah</option>
                                <option value="CAT-005">Bumbu Dapur</option>
                            </select>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small text-secondary fw-medium mb-1">Satuan <span class="text-danger">*</span></label>
                            <input type="text" class="form-control rounded-3 px-3 py-2"  placeholder="pcs / kg / bks" required>
                        </div>
                    </div>
                </div>

                <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4 mb-3">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <div class="bg-success bg-opacity-10 text-success rounded-3 p-2 d-inline-flex"><i data-lucide="banknote" width="16" height="16"></i></div>
                        <span class="fw-bold text-dark">Harga</span>
                    </div>
                    <div class="row g-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small text-secondary fw-medium mb-1">Harga Beli Satuan <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary fw-semibold small rounded-start-3">Rp</span>
                                <input type="number" class="form-control rounded-end-3 px-3 py-2"  placeholder="0" min="0" required>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small text-secondary fw-medium mb-1">Harga Jual Satuan <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary fw-semibold small rounded-start-3">Rp</span>
                                <input type="number" class="form-control rounded-end-3 px-3 py-2"  placeholder="0" min="0" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white border rounded-4 shadow-sm p-3 p-md-4">
                    <div class="d-flex align-items-center gap-2 mb-3">
                        <div class="bg-primary bg-opacity-10 text-primary rounded-3 p-2 d-inline-flex"><i data-lucide="boxes" width="16" height="16"></i></div>
                        <span class="fw-bold text-dark">Stok &amp; Lokasi</span>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small text-secondary fw-medium mb-1">Stok Fisik <span class="text-danger">*</span></label>
                            <input type="number" class="form-control rounded-3 px-3 py-2" value="0" min="0" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small text-secondary fw-medium mb-1">Batas Min. Stok <span class="text-danger">*</span></label>
                            <input type="number" class="form-control rounded-3 px-3 py-2" value="5" min="0" required>
                            <small class="text-secondary d-block mt-1" style="font-size: 0.72rem;">Muncul di Peringatan Stok Menipis</small>
                        </div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label small text-secondary fw-medium mb-1">Lokasi / Rak Penyimpanan <span class="text-secondary fw-normal">(Opsional)</span></label>
                        <input type="text" class="form-control rounded-3 px-3 py-2"  placeholder="Contoh: Rak A-02">
                    </div>
                </div>
            </div>
            <div class="modal-footer border-top bg-white px-4 py-3 d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary rounded-3 px-4 py-2 fw-medium">Batal</button>
                <button type="submit" class="btn btn-primary rounded-3 shadow-sm px-4 py-2 fw-semibold d-inline-flex align-items-center gap-2">
                    <i data-lucide="check" width="16" height="16"></i>
                    <span>Simpan Produk</span>
                </button>
            </div>
        </form>
    </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
