<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarungKu Modal | Edit Data Kategori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="icon" type="image/x-icon" href="../../assets/image/logo.ico">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.modal-standalone-canvas {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .modal-standalone-wrap {
            width: 100%;
        }
        .modal-standalone-wrap .modal {
            position: static;
            display: block;
            overflow: visible;
        }
        .modal-standalone-wrap .modal-dialog {
            margin: 0 auto;
            transform: none !important;
        }
    </style>
</head>

<body class="modal-standalone-canvas">
    <div class="modal-standalone-wrap">
        <div class="modal show" tabindex="-1" aria-modal="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
        <form class="modal-content border-0 shadow rounded-4 overflow-hidden" onsubmit="return false;">
            <div class="modal-header border-bottom px-4 py-3 bg-white">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-3 shadow-sm d-inline-flex align-items-center justify-content-center flex-shrink-0" style="width: 40px; height: 40px;">
                        <i data-lucide="tag" class="icon-sm"></i>
                    </div>
                    <div>
                        <h6 class="modal-title fw-bold text-dark mb-0">Edit Data Kategori</h6>
                        <small class="text-secondary">Atur pengelompokan produk warung</small>
                    </div>
                </div>
                <button type="button" class="btn-close shadow-none" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary mb-2">Nama Kategori <span class="text-danger">*</span></label>
                    <input type="text" class="form-control rounded-3 bg-light py-2 px-3 shadow-none" value="Sembako" placeholder="Contoh: Sembako, Minuman, Snack" required>
                    <small class="text-secondary d-block mt-2" style="font-size: 0.75rem;">
                        Gunakan nama singkat dan jelas agar mudah dicari di kasir.
                    </small>
                </div>
                <div class="mb-1">
                    <label class="form-label small fw-semibold text-secondary mb-2">Status Kategori</label>
                    <select class="form-select rounded-3 bg-light py-2 px-3 shadow-none">
                        <option value="1" selected>Aktif (Tampil di Kasir)</option>
                        <option value="0">Non-Aktif Sementara</option>
                    </select>
                    <small class="text-secondary d-block mt-2" style="font-size: 0.75rem;">
                        Kategori non-aktif tidak muncul di halaman kasir.
                    </small>
                </div>
            </div>
            <div class="modal-footer border-top bg-light px-4 py-3 d-flex justify-content-between">
                <button type="button" class="btn btn-outline-secondary rounded-3 px-3 py-2 fw-medium">Batal</button>
                <button type="submit" class="btn btn-primary rounded-3 shadow-sm d-inline-flex align-items-center gap-2 px-3 py-2 fw-semibold">
                    <i data-lucide="check" width="16" height="16"></i>
                    <span>Simpan Kategori</span>
                </button>
            </div>
        </form>
    </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
</body>

</html>
